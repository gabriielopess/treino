<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0B0D10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino Live">
  <meta name="format-detection" content="telephone=no">
  <title>Treino Live</title>
  <script>
  (function(){try{var t=localStorage.getItem('treinoLiveThemeV2');if(t==='light')document.documentElement.dataset.theme='light';}catch(e){}})();
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
:root{
  color-scheme:dark;
  --bg:#0B0D10;
  --bg-elev:#101318;
  --surface:#14181E;
  --surface-2:#1A1F27;
  --surface-3:#222934;
  --line:#242B35;
  --line-strong:#303846;
  --text:#F5F7FA;
  --muted:#9DA6B2;
  --faint:#68717F;
  --blue:#5B7CFF;
  --blue-2:#7290FF;
  --blue-soft:rgba(91,124,255,.14);
  --green:#42D392;
  --green-soft:rgba(66,211,146,.14);
  --red:#FF667A;
  --red-soft:rgba(255,102,122,.13);
  --amber:#FFB85C;
  --amber-soft:rgba(255,184,92,.12);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --shadow:0 24px 70px rgba(0,0,0,.45);
  --r-xl:26px;
  --r-lg:20px;
  --r-md:15px;
  --r-sm:11px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;color:var(--text);overscroll-behavior-y:none}
body{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-weight:500;transition:background .2s ease,color .2s ease}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
input,textarea,select{-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.is-hidden{display:none!important}

.app-shell{width:100%;max-width:600px;min-height:100dvh;margin:0 auto;position:relative;padding-bottom:calc(88px + var(--safe-bottom))}
.topbar{min-height:calc(68px + var(--safe-top));padding:calc(var(--safe-top) + 8px) 14px 8px;position:sticky;top:0;z-index:45;background:rgba(11,13,16,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar-leading{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.topbar-title{text-align:left;min-width:0;line-height:1.05}
.topbar-title small{display:block;color:var(--faint);font-size:9px;font-weight:850;letter-spacing:.14em;margin-bottom:4px}
.topbar-title strong{display:block;font-size:17px;font-weight:850;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:14px;background:transparent;color:var(--text);display:grid;place-items:center;padding:0;flex:0 0 auto}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:21px;height:21px}
.theme-toggle{background:var(--surface);border:1px solid var(--line);box-shadow:0 5px 18px rgba(0,0,0,.08)}

.main{min-height:calc(100dvh - 150px)}
.screen{padding-bottom:30px}
.hero{padding:26px 18px 14px}
.hero-kicker{display:block;color:var(--blue-2);font-size:9px;font-weight:900;letter-spacing:.14em;margin-bottom:8px}
.hero h1{font-size:30px;line-height:1.02;letter-spacing:-1.1px;margin:0 0 8px;font-weight:900}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;max-width:520px}
.section{margin:24px 18px 0}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
.section-title h2{margin:0;font-size:17px;letter-spacing:-.45px;font-weight:850}
.section-title span{color:var(--faint);font-size:10.5px;font-weight:650}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);max-width:600px;margin:0 auto;padding:7px 7px calc(7px + var(--safe-bottom));background:rgba(11,13,16,.91);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid rgba(255,255,255,.055)}
.nav-item{background:transparent;color:var(--faint);border-radius:14px;min-height:57px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px}
.nav-item span{height:23px;display:grid;place-items:center}
.nav-item svg{width:22px;height:22px}
.nav-item small{font-size:10px;font-weight:650}
.nav-item.is-active{color:var(--blue-2);background:rgba(91,124,255,.07)}

.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.metric-card{background:linear-gradient(180deg,var(--surface),var(--bg-elev));border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 28px rgba(0,0,0,.08)}
.metric-card small{color:var(--faint);font-size:9.5px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
.metric-card strong{display:block;font-size:24px;font-weight:900;letter-spacing:-.8px;line-height:1.08;margin-top:8px}
.metric-card p{margin:5px 0 0;color:var(--muted);font-size:10.5px;line-height:1.4}
.metric-card.highlight{background:linear-gradient(180deg,#1A2442,#141A2E);border-color:#2D4076}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card + .card{margin-top:12px}
.row-card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;display:flex;align-items:center;gap:13px;text-align:left;margin-bottom:11px}
.row-card:active{background:var(--surface-2)}
.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--blue-soft);color:#C8D2FF;display:grid;place-items:center;font-size:12px;font-weight:800;overflow:hidden}
.avatar.round{border-radius:50%}
.row-main{flex:1;min-width:0}
.row-main strong{display:block;font-size:13.5px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{display:block;color:var(--faint);font-size:10.5px;line-height:1.35;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}
.chev{color:var(--faint);width:18px;height:18px;flex:0 0 18px}

.toolbar{display:flex;gap:12px;margin:10px 18px 18px}
.search-field{flex:1;min-width:0;height:46px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-md);display:flex;align-items:center;gap:9px;padding:0 13px}
.search-field svg{width:17px;color:var(--faint);flex:0 0 auto}
.search-field input{min-width:0;flex:1;background:transparent;border:0;outline:0;font-size:13.5px}
.btn{height:48px;border-radius:var(--r-md);padding:0 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;white-space:nowrap;transition:transform .12s ease,background .14s ease,border-color .14s ease}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:active{background:#4E6FEF}
.btn-secondary{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--text)}
.btn-ghost{background:transparent;color:var(--blue-2)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-good{background:var(--green-soft);color:var(--green)}
.btn-sm{height:37px;border-radius:11px;padding:0 12px;font-size:11.5px}
.btn-block{width:100%}

.empty{padding:42px 24px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55}
.empty-icon{width:46px;height:46px;border-radius:15px;background:var(--surface-2);color:var(--faint);display:grid;place-items:center;margin:0 auto 11px}
.empty-icon svg{width:23px;height:23px}
.empty strong{display:block;color:var(--text);font-size:14px;margin-bottom:4px}

.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick-action{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px;text-align:left;color:var(--text)}
.quick-action svg{width:20px;height:20px;color:var(--blue-2);margin-bottom:13px}
.quick-action strong{display:block;font-size:12.5px}
.quick-action small{display:block;color:var(--faint);font-size:10px;line-height:1.35;margin-top:3px}

.insight-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 13px;display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:8px}
.insight-dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.insight-row.good .insight-dot{background:var(--green)}
.insight-row.warn .insight-dot{background:var(--amber)}
.insight-copy{min-width:0}
.insight-copy strong{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insight-copy small{display:block;color:var(--faint);font-size:10.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insight-value{font-size:11.5px;font-weight:800;color:var(--blue-2)}
.insight-row.good .insight-value{color:var(--green)}
.insight-row.warn .insight-value{color:var(--amber)}

.profile-head{padding:20px 18px 12px;display:flex;gap:13px;align-items:center}
.profile-head .avatar{width:54px;height:54px;flex-basis:54px;border-radius:18px;font-size:15px}
.profile-head .row-main strong{font-size:20px;letter-spacing:-.4px}
.profile-head .row-main small{font-size:11px;margin-top:4px}
.profile-actions{display:flex;gap:12px;margin:2px 18px 20px}
.profile-actions .btn{flex:1}
.profile-note{margin:0 18px 14px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.profile-note small{display:block;color:var(--faint);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.profile-note p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}

.workout-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:13px}
.workout-card-head{display:flex;align-items:center;gap:8px}
.workout-card-head strong{font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workout-card-head button{background:transparent;color:var(--faint);font-size:22px;padding:0 4px}
.workout-meta{color:var(--faint);font-size:10.5px;margin-top:6px}
.workout-exercises-preview{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.workout-exercises-preview div{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11px;padding:4px 0}
.workout-exercises-preview span{width:18px;color:var(--faint);font-size:9px;font-weight:800}
.workout-actions{display:flex;gap:12px;margin-top:14px}
.workout-actions .btn{flex:1}

.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;min-height:25px;border-radius:9px;background:var(--surface-3);color:var(--muted);padding:4px 8px;font-size:10px;font-weight:700}
.exercise-list-card{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.exercise-list-card:last-child{border-bottom:0}
.exercise-symbol{width:38px;height:38px;border-radius:12px;background:var(--blue-soft);color:var(--blue-2);display:grid;place-items:center;flex:0 0 auto}
.exercise-symbol svg{width:18px;height:18px}
.exercise-list-card .row-main small{white-space:normal}

.modal-layer{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.modal{position:relative;z-index:1;width:100%;max-width:600px;max-height:91dvh;overflow:auto;background:var(--bg-elev);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + var(--safe-bottom));box-shadow:var(--shadow)}
.modal.fullscreen{height:100dvh;max-height:100dvh;border-radius:0;padding:calc(8px + var(--safe-top)) 16px calc(18px + var(--safe-bottom));display:flex;flex-direction:column}
.modal-handle{width:34px;height:4px;border-radius:99px;background:var(--surface-3);margin:2px auto 15px}
.modal h2{font-size:20px;letter-spacing:-.4px;margin:0 0 4px}
.modal-sub{margin:0 0 17px;color:var(--muted);font-size:12px;line-height:1.45}
.modal-actions{display:flex;gap:12px;margin-top:20px}
.modal-actions .btn{flex:1}
.form-row{margin-bottom:15px}
.form-label{display:block;color:var(--faint);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.form-input,.form-select,.form-textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:var(--r-md);outline:0}
.form-input,.form-select{height:47px;padding:0 13px;font-size:13.5px}
.form-textarea{min-height:96px;resize:vertical;padding:11px 13px;font-size:13px;line-height:1.45}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.group-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group-button{min-height:43px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:12px;font-size:11.5px;font-weight:700;color:var(--muted)}
.group-button.is-selected{border-color:var(--blue);background:var(--blue-soft);color:#C7D2FF}
.choice-list{display:flex;flex-direction:column;gap:10px}
.choice{width:100%;text-align:left;display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.choice:active{background:var(--surface-2)}
.choice .row-main small{white-space:normal}
.action-list{display:flex;flex-direction:column;gap:9px}
.action-item{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--text);text-align:left;padding:12px 13px}
.action-item:last-child{border-bottom:1px solid var(--line)}
.action-icon{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.action-item.danger{color:var(--red)}
.action-item.danger .action-icon{background:var(--red-soft);color:var(--red)}
.action-item .row-main strong{font-size:13px}

.builder-head{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding:2px 0 12px;border-bottom:1px solid var(--line)}
.builder-head h2{flex:1;margin:0;font-size:17px}
.builder-body{flex:1;overflow:auto;padding:16px 1px 12px}
.builder-foot{flex:0 0 auto;border-top:1px solid var(--line);padding-top:12px}
.builder-exercise{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px;margin-bottom:10px}
.builder-exercise-head{display:flex;align-items:center;gap:8px}
.builder-exercise-name{flex:1;min-width:0;background:transparent;color:var(--text);text-align:left;font-size:13.5px;font-weight:720;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.builder-remove{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--faint);font-size:20px}
.builder-controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.control-label{display:block;color:var(--faint);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.stepper{height:40px;display:grid;grid-template-columns:37px 1fr 37px;align-items:center;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:11px;overflow:hidden}
.stepper button{height:100%;background:transparent;color:var(--blue-2);font-size:18px;font-weight:700}
.stepper span{text-align:center;font-size:13px;font-weight:760}
.builder-rest{height:40px;width:100%;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:11px;text-align:center;outline:0;font-size:12px}
.add-dashed{height:45px;width:100%;border:1px dashed var(--line-strong);background:transparent;border-radius:14px;color:var(--blue-2);font-size:12.5px;font-weight:750}

.preview-wrap{padding:18px}
.preview-title small{display:block;color:var(--faint);font-size:10px;font-weight:800;letter-spacing:.1em;margin-bottom:6px}
.preview-title h1{font-size:28px;line-height:1.05;margin:0 0 7px;letter-spacing:-.7px}
.preview-title p{color:var(--muted);font-size:12.5px;line-height:1.45;margin:0}
.preview-person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:14px}
.preview-person-head{display:flex;align-items:center;gap:11px;background:var(--surface-2);border-bottom:1px solid var(--line);padding:12px}
.preview-person-head .avatar{border-radius:50%}
.preview-person-head .row-main small{white-space:normal}
.preview-ex-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);align-items:center}
.preview-ex-row:last-child{border-bottom:0}
.preview-ex-row span{font-size:9px;color:var(--faint);font-weight:800}
.preview-ex-row strong{font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-ex-row small{font-size:10px;color:var(--faint);white-space:nowrap}

.live-header{padding:14px 18px 6px}
.live-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.live-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 7px;text-align:center}
.live-stat small{display:block;color:var(--faint);font-size:8.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.live-stat strong{font-size:15px;letter-spacing:-.3px}
.live-stat strong.accent{color:var(--blue-2)}
.live-person-head{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-weight:700;margin:18px 18px 8px}
.live-person-head .avatar{width:26px;height:26px;flex-basis:26px;border-radius:50%;font-size:8.5px}
.live-exercise-card{margin:0 18px 11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.live-exercise-head{display:flex;align-items:flex-start;gap:8px}
.live-exercise-head .row-main strong{font-size:16px;letter-spacing:-.25px;white-space:normal}
.live-exercise-head .row-main small{white-space:normal;margin-top:5px}
.live-more{width:32px;height:32px;border-radius:50%;background:transparent;color:var(--faint);font-size:20px;padding:0}
.live-note{width:100%;height:34px;margin-top:9px;border:0;border-bottom:1px solid var(--line);background:transparent;outline:0;color:var(--muted);font-size:11.5px}
.set-head,.set-row{display:grid;grid-template-columns:30px minmax(52px,1fr) 64px 57px 40px;gap:6px;align-items:center}
.set-head{padding:13px 1px 6px;color:var(--faint);font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.set-row{margin-bottom:7px}
.set-index{height:42px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:11.5px;font-weight:800}
.set-prev{font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-input{width:100%;height:42px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:10px;text-align:center;outline:0;font-size:13.5px;font-weight:700;padding:0 3px}
.set-check{width:40px;height:42px;border-radius:10px;background:var(--surface-2);color:var(--faint);display:grid;place-items:center}
.set-check svg{width:17px;height:17px}
.set-row.is-done .set-index,.set-row.is-done .set-check{background:var(--green);color:#092116}
.set-row.is-done .set-input{border-color:rgba(66,211,146,.55);background:var(--green-soft)}
.live-exercise-footer{display:flex;gap:10px;margin-top:10px}
.live-exercise-footer .btn{flex:1}
.live-finish{display:flex;gap:12px;margin:20px 18px 26px}
.live-finish .btn{flex:1}

.evo-filter-row{display:flex;gap:10px;margin:0 18px 16px;overflow:auto;scrollbar-width:none;padding:1px 0 3px}

.period-btn{height:34px;min-width:57px;border:1px solid var(--line-strong);background:var(--surface);border-radius:11px;color:var(--muted);font-size:10.5px;font-weight:750;padding:0 11px}
.period-btn.is-active{background:var(--blue);color:#fff;border-color:var(--blue)}
.chart-card{margin:0 18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px;overflow:hidden}
.chart-card-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.chart-card-head strong{font-size:15px;font-weight:850;letter-spacing:-.25px}
.chart-card-head small{display:block;color:var(--faint);font-size:10.5px;margin-top:4px;line-height:1.4}

.chart-hint{font-size:9.5px;color:var(--faint);white-space:nowrap}

.detail-line-chart{display:block;max-width:none}
.chart-grid-line{stroke:var(--line);stroke-width:1;stroke-dasharray:4 5}

.point-value{fill:var(--blue-2);font-size:10px;font-weight:850}
.chart-footnote{color:var(--faint);font-size:9.5px;line-height:1.4;margin-top:4px}
.progress-row{margin-top:12px}

.progress-row-head strong{font-size:11.5px}
.progress-row-head small{display:block;color:var(--faint);font-size:9.5px;margin-top:2px}
.progress-row-head b{font-size:10.5px;color:var(--muted)}

.change-list{margin-top:4px}
.change-row{width:100%;display:flex;align-items:center;gap:10px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:left}
.change-row:last-child{border-bottom:0}
.change-history-icon{width:28px;height:28px;border-radius:9px;background:var(--surface-2);color:var(--faint);display:grid;place-items:center;flex:0 0 auto}

.change-row .row-main small{white-space:normal}

.coach-report{margin:0 18px 12px;background:linear-gradient(180deg,#171E31,#141924);border:1px solid #2E3C64;border-radius:var(--r-lg);padding:15px}

.coach-report p{margin:0;color:#CBD2E6;font-size:11.5px;line-height:1.55}

.history-session-head strong{font-size:12.5px}
.history-session-head span{font-size:11px;font-weight:800;color:var(--blue-2)}
.history-session small{display:block;color:var(--faint);font-size:9.5px;margin-top:4px}
.history-exercise{width:100%;padding:11px 0;border:0;border-top:1px solid var(--line);margin-top:9px;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.history-exercise>div{min-width:0;flex:1}
.history-exercise strong{font-size:12px;font-weight:800}
.history-exercise small{color:var(--muted);font-size:10px;line-height:1.5;margin-top:4px;white-space:normal}
.history-exercise svg{width:17px;height:17px;color:var(--faint);flex:0 0 auto}
.feedback-box{margin-top:9px;padding:10px 11px;border-radius:11px;background:var(--surface-2);color:var(--muted);font-size:10.5px;line-height:1.45}
.feedback-box b{color:var(--text)}

.toast-host{position:fixed;left:0;right:0;bottom:calc(92px + var(--safe-bottom));z-index:140;display:flex;justify-content:center;pointer-events:none;padding:0 15px}
.toast{background:#F3F5F8;color:#11151B;border-radius:999px;padding:11px 15px;font-size:11.5px;font-weight:750;box-shadow:var(--shadow);animation:toastIn .18s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(7px) scale(.97)}to{opacity:1;transform:none}}

.divider{height:1px;background:var(--line);margin:15px 0}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.text-good{color:var(--green)!important}
.text-warn{color:var(--amber)!important}
.text-bad{color:var(--red)!important}


/* Home chart: seven columns stay readable instead of being squeezed. */
.home-hero{padding-bottom:16px}
.home-volume-card{margin-top:18px}
.weekly-chart{display:grid;grid-template-columns:repeat(7,minmax(34px,1fr));gap:8px;height:190px;margin-top:18px;align-items:end;min-width:0}
.week-column{height:100%;display:grid;grid-template-rows:22px 1fr 18px 14px;gap:4px;text-align:center;align-items:end;min-width:0}
.week-value{font-size:9px;font-weight:850;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-track{height:118px;background:var(--surface-2);border-radius:10px;display:flex;align-items:flex-end;overflow:hidden;padding:3px}
.week-track i{width:100%;display:block;background:linear-gradient(180deg,var(--blue-2),var(--blue));border-radius:7px;min-height:3px}
.week-column b{font-size:10px;font-weight:850;text-transform:uppercase;color:var(--text)}
.week-column small{font-size:8.5px;color:var(--faint)}

/* Clickable exercise history rows. */
.workout-exercises-preview{display:flex;flex-direction:column;gap:5px}
.workout-exercises-preview .program-exercise-row{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) 18px;align-items:center;gap:9px;padding:9px 8px;margin:0;border:0;border-radius:11px;background:transparent;color:var(--text);text-align:left}
.workout-exercises-preview .program-exercise-row:active{background:var(--surface-2)}
.program-exercise-row>span{width:auto!important;color:var(--faint);font-size:9px;font-weight:850}
.program-exercise-row>div{display:block!important;min-width:0;padding:0!important}
.program-exercise-row strong{display:block;font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.program-exercise-row small{display:block;color:var(--faint);font-size:9.5px;margin-top:2px}
.program-exercise-row>svg{width:16px;height:16px;color:var(--faint)}
.live-exercise-history{flex:1;min-width:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:8px;text-align:left;padding:0}
.live-exercise-history .row-main{min-width:0}
.history-mini{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:var(--surface-2);color:var(--faint);flex:0 0 auto}
.history-mini svg{width:15px;height:15px}

/* Full exercise-history view. */
.history-modal-head{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:4px 2px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.history-modal-head .icon-btn{background:var(--surface);border:1px solid var(--line)}
.history-modal-head div{min-width:0}
.history-modal-head small{display:block;color:var(--blue-2);font-size:8.5px;font-weight:900;letter-spacing:.13em;margin-bottom:3px}
.history-modal-head strong{display:block;font-size:18px;font-weight:900;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-modal-head span{display:block;color:var(--muted);font-size:10.5px;margin-top:3px}
.exercise-history-content{overflow:auto;margin:0 -16px;padding:18px 0 30px}
.history-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 18px 16px}
.history-summary-grid>div{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 10px;min-width:0}
.history-summary-grid small{display:block;color:var(--faint);font-size:8.5px;font-weight:850;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.history-summary-grid strong{display:block;font-size:17px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-chart-card{margin-bottom:20px}
.history-chart-wrap .chart-scroll{margin-top:4px}
.history-execution-section{margin-top:4px}
.execution-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}
.execution-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.execution-card-head strong{font-size:13px;font-weight:850}
.execution-card-head small{display:block;color:var(--faint);font-size:9.5px;margin-top:3px}
.execution-card-head>div:last-child{text-align:right}
.execution-card-head b{font-size:15px;font-weight:900;color:var(--blue-2)}
.execution-sets{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.execution-sets span{display:inline-flex;align-items:center;gap:5px;padding:7px 9px;background:var(--surface-2);border-radius:10px;color:var(--muted);font-size:10px}
.execution-sets b{color:var(--text);font-size:9px}
.execution-footer{display:flex;justify-content:space-between;gap:10px;color:var(--faint);font-size:9.5px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.trend-highlight{display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;padding:13px;border-radius:14px;background:var(--surface-2);margin-top:11px}
.trend-highlight>span{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-2)}
.trend-highlight>span svg{width:19px;height:19px}
.trend-highlight small{display:block;font-size:8.5px;font-weight:900;letter-spacing:.07em;color:var(--faint);margin-bottom:3px}
.trend-highlight strong{display:block;font-size:12.5px;font-weight:850}
.trend-highlight p{margin:3px 0 0;color:var(--muted);font-size:10px}
.trend-highlight.good>span{background:var(--green-soft);color:var(--green)}
.trend-highlight.warn>span{background:var(--amber-soft);color:var(--amber)}

/* True light mode. */
html[data-theme="light"]{color-scheme:light;--bg:#F5F6F8;--bg-elev:#FFFFFF;--surface:#FFFFFF;--surface-2:#F0F2F5;--surface-3:#E7EAF0;--line:#E3E6EB;--line-strong:#D5DAE2;--text:#12151A;--muted:#5F6875;--faint:#8B94A0;--blue:#315CF5;--blue-2:#244FD9;--blue-soft:rgba(49,92,245,.10);--green:#159D69;--green-soft:rgba(21,157,105,.11);--red:#D64258;--red-soft:rgba(214,66,88,.10);--amber:#B96C10;--amber-soft:rgba(185,108,16,.10);--shadow:0 24px 70px rgba(22,30,42,.14)}

html[data-theme="light"] .active-workout-pill,html[data-theme="light"] .rest-timer{background:#FFFFFF;border-color:#D9DFEB;box-shadow:0 14px 40px rgba(22,30,42,.14)}
html[data-theme="light"] .rest-timer-actions .rest-skip{background:#11151B;color:#fff}
html[data-theme="light"] .toast{background:#12151A;color:#fff}

@media(max-width:390px){
  .hero{padding-left:14px;padding-right:14px}
  .section,.chart-card,.coach-report{margin-left:14px;margin-right:14px}
  .toolbar,.profile-actions,.profile-note,.live-person-head,.live-exercise-card,.live-finish{margin-left:14px;margin-right:14px}
  .grid-2{gap:10px}
  .metric-card{padding:14px;min-height:110px}
  .metric-card strong{font-size:21px}
  .topbar{padding-left:10px;padding-right:10px}
  .weekly-chart{gap:5px}
  .week-track{height:112px}
  .history-summary-grid{margin-left:14px;margin-right:14px;gap:7px}
  .history-summary-grid strong{font-size:15px}
  .set-head,.set-row{grid-template-columns:28px minmax(43px,1fr) 59px 53px 38px;gap:4px}
  .set-input{font-size:12.5px}
  .set-check{width:38px}
  .form-grid,.builder-controls{grid-template-columns:1fr}
  .group-grid{grid-template-columns:1fr 1fr}
}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ----------------------------- utilities ----------------------------- */

function uid(prefix = 'id') {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return `${prefix}_${crypto.randomUUID()}`;
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[ch]));
}

function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  return (parts.slice(0, 2).map(p => p[0]).join('') || '?').toUpperCase();
}

function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
function round(n) { return Math.round(Number(n) || 0); }
function kgText(n) { return `${round(n).toLocaleString('pt-BR')} kg`; }
function fmtDate(isoOrDate) {
  if (!isoOrDate) return '—';
  const d = typeof isoOrDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(isoOrDate)
    ? new Date(`${isoOrDate}T12:00:00`)
    : new Date(isoOrDate);
  if (Number.isNaN(d.getTime())) return String(isoOrDate);
  return d.toLocaleDateString('pt-BR');
}
function localDateISO(ts = Date.now()) {
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function fmtClock(seconds) {
  const total = Math.max(0, Math.floor(Number(seconds) || 0));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function parseDecimal(v) {
  const n = Number(String(v ?? '').replace(',', '.'));
  return Number.isFinite(n) ? Math.max(0, n) : 0;
}
function parseInteger(v) {
  const n = parseInt(String(v ?? ''), 10);
  return Number.isFinite(n) ? Math.max(0, n) : 0;
}
function parseRest(v) {
  const raw = String(v || '').trim();
  if (!raw) return 0;
  if (raw.includes(':')) {
    const [m, s] = raw.split(':').map(Number);
    return Math.max(0, (m || 0) * 60 + (s || 0));
  }
  return Math.max(0, Number(raw) || 0);
}
function fmtRest(sec) {
  sec = Math.max(0, Number(sec) || 0);
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function daysAgo(ts) {
  if (!ts) return 'sem registro';
  const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 86400000);
  if (diff <= 0) return 'hoje';
  if (diff === 1) return 'ontem';
  if (diff < 7) return `há ${diff} dias`;
  if (diff < 30) return `há ${Math.floor(diff/7)} sem`;
  if (diff < 365) return `há ${Math.floor(diff/30)} meses`;
  return `há ${Math.floor(diff/365)} anos`;
}
function cutoffFromPeriod(period) {
  if (period === 'all') return null;
  const days = { '30d':30, '90d':90, '180d':180, '365d':365 }[period] || 90;
  return Date.now() - days * 86400000;
}
function toast(message) {
  const host = $('#toastHost');
  host.replaceChildren();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  host.appendChild(el);
  setTimeout(() => { if (el.isConnected) el.remove(); }, 2300);
}
function chev() { return `<span class="chev">${icons.back.replace('M15 5l-7 7 7 7','M9 5l7 7-7 7')}</span>`; }
function studentById(id) { return db.students.find(s => s.id === id) || null; }
function exerciseById(id) { return db.exercises.find(e => e.id === id) || null; }
function programById(id) { return db.programs.find(p => p.id === id) || null; }
function programsForStudent(studentId) { return db.programs.filter(p => p.studentId === studentId); }
function participantForStudent(session, studentId) { return (session.participants || []).find(p => p.studentId === studentId) || null; }
function completedSets(exercise) { return (exercise.sets || []).filter(s => s.done !== false); }
function setVolume(set) { return parseDecimal(set.weight) * parseInteger(set.reps); }
function exerciseVolume(exercise) { return completedSets(exercise).reduce((sum, set) => sum + setVolume(set), 0); }
function participantVolume(participant) { return (participant.exercises || []).reduce((sum, ex) => sum + exerciseVolume(ex), 0); }
function participantSetCount(participant) { return (participant.exercises || []).reduce((sum, ex) => sum + completedSets(ex).length, 0); }
function sessionVolume(session) { return (session.participants || []).reduce((sum, p) => sum + participantVolume(p), 0); }
function sessionSetCount(session) { return (session.participants || []).reduce((sum, p) => sum + participantSetCount(p), 0); }
function sessionTimestamp(session) { return Number(session.endedAt || session.startedAt || session.createdAt || 0); }
function latestStudentSession(studentId) {
  return db.sessions
    .filter(s => participantForStudent(s, studentId))
    .sort((a,b) => sessionTimestamp(b)-sessionTimestamp(a))[0] || null;
}
function sessionsForStudent(studentId, period = 'all') {
  const cutoff = cutoffFromPeriod(period);
  return db.sessions
    .filter(s => participantForStudent(s, studentId) && (!cutoff || sessionTimestamp(s) >= cutoff))
    .sort((a,b) => sessionTimestamp(a)-sessionTimestamp(b));
}
function getLastExercisePerformance(studentId, exerciseId) {
  const sessions = db.sessions
    .filter(s => participantForStudent(s, studentId))
    .sort((a,b) => sessionTimestamp(b)-sessionTimestamp(a));
  for (const session of sessions) {
    const p = participantForStudent(session, studentId);
    const ex = (p.exercises || []).find(x => x.exerciseId === exerciseId);
    if (ex && completedSets(ex).length) return ex;
  }
  return null;
}
function bestLoad(exercise) {
  return completedSets(exercise).reduce((m,s) => Math.max(m, parseDecimal(s.weight)), 0);
}


const THEME_KEY = 'treinoLiveThemeV2';
function currentTheme() { return document.documentElement.dataset.theme || 'dark'; }
function applyTheme(theme, persistChoice = true) {
  const next = theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  document.body?.setAttribute('data-theme', next);
  const meta = document.querySelector('meta[name="theme-color"]');

  if (persistChoice) localStorage.setItem(THEME_KEY, next);

}
function initTheme() {

}
function toggleTheme() { applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'); }
function syncThemeToggle() {

}
function compactNumber(n) {
  n = Number(n) || 0;
  if (n >= 1_000_000) return `${(n/1_000_000).toFixed(n >= 10_000_000 ? 0 : 1).replace('.',',')} mi`;
  if (n >= 1000) return `${(n/1000).toFixed(n >= 10_000 ? 0 : 1).replace('.',',')} mil`;
  return String(round(n));
}
function dateShort(ts) {
  const d = new Date(ts); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}
function weekdayShort(ts) {

/* ----------------------------- persistence ----------------------------- */

function blankDatabase() {
  return {
    version: APP_VERSION,
    trainer: { name: 'Gabriel' },
    students: [],
    exercises: [],
    programs: [],
    sessions: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

function normalizeGroups(groups) {
  const aliases = {
    'Ombro':'Ombros','Posterior':'Posteriores','Posterior de coxa':'Posteriores',
    'Glúteo':'Glúteos','Panturrilha':'Panturrilhas'
  };
  const arr = Array.isArray(groups) ? groups : (groups ? [groups] : []);
  const out = arr.map(v => aliases[String(v).trim()] || String(v).trim()).filter(Boolean);
  const valid = [...new Set(out.filter(g => MUSCLE_GROUPS.includes(g)))];
  return valid.length ? valid : ['Outro'];
}

function normalizeDatabase(raw) {
  const clean = blankDatabase();
  if (!raw || typeof raw !== 'object') return clean;
  clean.trainer = { name: String(raw.trainer?.name || 'Gabriel').trim() || 'Gabriel' };
  clean.students = Array.isArray(raw.students) ? raw.students.map(s => ({
    id: String(s.id || uid('student')),
    name: String(s.name || 'Aluno').trim(),
    goal: String(s.goal || ''),
    notes: String(s.notes || ''),
    createdAt: Number(s.createdAt || Date.now())
  })) : [];
  clean.exercises = Array.isArray(raw.exercises) ? raw.exercises.map(e => ({
    id: String(e.id || uid('exercise')),
    name: String(e.name || 'Exercício').trim(),
    muscleGroups: normalizeGroups(e.muscleGroups),
    createdAt: Number(e.createdAt || Date.now())
  })) : [];
  clean.programs = Array.isArray(raw.programs) ? raw.programs.map(p => ({
    id: String(p.id || uid('program')),
    studentId: String(p.studentId || ''),
    name: String(p.name || 'Treino').trim(),
    startDate: String(p.startDate || ''),
    endDate: String(p.endDate || ''),
    exercises: Array.isArray(p.exercises) ? p.exercises.map(pe => ({
      exerciseId: String(pe.exerciseId || ''),
      sets: clamp(parseInteger(pe.sets) || 3, 1, 50),
      restSec: clamp(parseInteger(pe.restSec ?? pe.rest) || 120, 0, 3600),
      targetReps: String(pe.targetReps || ''),
      note: String(pe.note || '')
    })) : [],
    createdAt: Number(p.createdAt || Date.now()),
    updatedAt: Number(p.updatedAt || Date.now())
  })).filter(p => clean.students.some(s => s.id === p.studentId)) : [];
  clean.sessions = Array.isArray(raw.sessions) ? raw.sessions.map(s => ({
    id: String(s.id || uid('session')),
    createdAt: Number(s.createdAt || s.startedAt || Date.now()),
    startedAt: Number(s.startedAt || s.createdAt || Date.now()),
    endedAt: Number(s.endedAt || s.startedAt || s.createdAt || Date.now()),
    durationSec: Math.max(0, Number(s.durationSec) || 0),
    participants: Array.isArray(s.participants) ? s.participants.map(p => ({
      studentId: String(p.studentId || ''),
      programId: String(p.programId || ''),
      programName: String(p.programName || 'Treino'),
      feedback: String(p.feedback || ''),
      exercises: Array.isArray(p.exercises) ? p.exercises.map(ex => ({
        exerciseId: String(ex.exerciseId || ''),
        name: String(ex.name || clean.exercises.find(item => item.id === String(ex.exerciseId || ''))?.name || 'Exercício'),
        muscleGroups: normalizeGroups(ex.muscleGroups),
        restSec: clamp(parseInteger(ex.restSec) || 0, 0, 3600),
        note: String(ex.note || ''),
        sets: Array.isArray(ex.sets) ? ex.sets.map(st => ({
          weight: parseDecimal(st.weight ?? st.kg),
          reps: parseInteger(st.reps),
          done: st.done !== false
        })) : []
      })) : []
    })).filter(p => clean.students.some(st => st.id === p.studentId)) : []
  })).filter(s => s.participants.length) : [];
  clean.version = APP_VERSION;
  clean.createdAt = Number(raw.createdAt || Date.now());
  clean.updatedAt = Number(raw.updatedAt || Date.now());
  return clean;
}

function legacyDateToTs(value) {
  const m = String(value || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1], 12, 0, 0).getTime();
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? Date.now() : d.getTime();
}

function migrateLegacy(legacy) {
  if (!legacy || !Array.isArray(legacy.students)) return null;
  const out = blankDatabase();
  const exerciseIdByName = new Map();
  const exerciseMeta = legacy.exerciseMeta && typeof legacy.exerciseMeta === 'object' ? legacy.exerciseMeta : {};
  const allNames = new Set(Array.isArray(legacy.library) ? legacy.library.map(String) : []);
  legacy.students.forEach(st => (st.workouts || []).forEach(w => (w.exercises || []).forEach(ex => allNames.add(String(ex.name || '')))));
  (legacy.records || []).forEach(r => allNames.add(String(r.exercise || '')));
  [...allNames].filter(Boolean).forEach(name => {
    const id = uid('exercise');
    exerciseIdByName.set(name, id);
    out.exercises.push({ id, name, muscleGroups: normalizeGroups(exerciseMeta[name]), createdAt: Date.now() });
  });
  out.students = legacy.students.map(st => ({
    id: String(st.id || uid('student')),
    name: String(st.name || 'Aluno'),
    goal: '', notes: '', createdAt: Date.now()
  }));
  legacy.students.forEach(st => {
    (st.workouts || []).forEach(w => {
      out.programs.push({
        id: String(w.id || uid('program')),
        studentId: String(st.id),
        name: String(w.name || 'Treino'),
        startDate: String(w.startDate || ''),
        endDate: String(w.endDate || ''),
        exercises: (w.exercises || []).map(ex => ({
          exerciseId: exerciseIdByName.get(String(ex.name)) || '',
          sets: clamp(parseInteger(ex.sets) || 3, 1, 50),
          restSec: clamp(parseInteger(ex.rest) || 120, 0, 3600),
          targetReps: '', note: String(ex.note || '')
        })).filter(ex => ex.exerciseId),
        createdAt: Date.now(), updatedAt: Date.now()
      });
    });
  });
  const grouped = new Map();
  (legacy.records || []).forEach(rec => {
    const key = `${rec.student}::${rec.workout}::${rec.date}`;
    if (!grouped.has(key)) grouped.set(key, { studentId:String(rec.student), programId:String(rec.workout || ''), date:rec.date, records:[] });
    grouped.get(key).records.push(rec);
  });
  grouped.forEach(g => {
    const ts = legacyDateToTs(g.date);
    const program = out.programs.find(p => p.id === g.programId);
    const participant = {
      studentId: g.studentId,
      programId: g.programId,
      programName: program?.name || 'Treino',
      feedback: '',
      exercises: g.records.map(rec => ({
        exerciseId: exerciseIdByName.get(String(rec.exercise)) || uid('exercise_missing'),
        name: String(rec.exercise || 'Exercício'),
        muscleGroups: normalizeGroups(exerciseMeta[rec.exercise]),
        restSec: 0,
        note: '',
        sets: (rec.sets || []).map(s => ({ weight:parseDecimal(s.kg), reps:parseInteger(s.reps), done:true }))
      }))
    };
    if (out.students.some(st => st.id === participant.studentId)) {
      out.sessions.push({
        id: uid('session'), createdAt:ts, startedAt:ts, endedAt:ts,
        durationSec:0, participants:[participant]
      });
    }
  });
  out.updatedAt = Date.now();
  return out;
}

function loadDatabase() {
  try {
    const saved = localStorage.getItem(DB_KEY);
    if (saved) return normalizeDatabase(JSON.parse(saved));
  } catch (err) { console.warn('Falha ao carregar banco novo', err); }
  try {
    const legacyRaw = localStorage.getItem(LEGACY_KEY);
    if (legacyRaw) {
      const migrated = migrateLegacy(JSON.parse(legacyRaw));
      if (migrated) {
        localStorage.setItem(DB_KEY, JSON.stringify(migrated));
        setTimeout(() => toast('Dados do app antigo migrados com sucesso.'), 600);
        return migrated;
      }
    }
  } catch (err) { console.warn('Falha ao migrar dados antigos', err); }
  return blankDatabase();
}

function persist() {
  db.updatedAt = Date.now();
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && Array.isArray(parsed.participants) && parsed.participants.length) return parsed;
  } catch (err) { console.warn('Falha ao restaurar treino em andamento', err); }
  return null;
}

function persistDraft() {
  if (live) localStorage.setItem(DRAFT_KEY, JSON.stringify(live));
  else localStorage.removeItem(DRAFT_KEY);
}

function setHeader({ eyebrow='TREINO LIVE', title='', back=null, action='more', actionFn=null }) {
  $('#topEyebrow').textContent = eyebrow;

  const backBtn = $('#backBtn');

    backBtn.onclick = null;
  }

    actionBtn.classList.add('is-hidden');
    actionBtn.onclick = null;
  } else {
    actionBtn.classList.remove('is-hidden');
    actionBtn.innerHTML = icons[action] || icons.more;
    actionBtn.onclick = actionFn;
  }
  const themeBtn = $('#themeToggle');
  if (themeBtn) themeBtn.classList.toggle('is-hidden', state.route !== 'home');
  syncThemeToggle();
}

function navigate(route, opts = {}) {
  state.route = route;
  Object.assign(state, opts);
  render();
  window.scrollTo(0,0);
}

function render() {
  const main = $('#main');
  const route = state.route;
  if (route === 'home') renderHome(main);
  else if (route === 'students') renderStudents(main);
  else if (route === 'student') renderStudentProfile(main, state.studentId);
  else if (route === 'student-history') renderStudentHistory(main, state.historyStudentId || state.studentId);
  else if (route === 'exercises') renderExercises(main);
  else if (route === 'evolution') renderEvolution(main);
  else if (route === 'evolution-detail') renderEvolutionDetail(main, state.evolutionStudentId);
  else if (route === 'workout') renderWorkout(main);
  else navigate('home');

  $$('.nav-item').forEach(btn => btn.classList.toggle('is-active', btn.dataset.route === route));
  if (!['home','students','exercises','evolution'].includes(route)) {
    $$('.nav-item').forEach(btn => btn.classList.remove('is-active'));
  }
  syncActiveWorkoutPill();
  syncRestTimer();
}

function syncActiveWorkoutPill() {
  const pill = $('#activeWorkoutPill');
  if (!live || state.route === 'workout') {
    pill.classList.add('is-hidden');
    return;
  }
  pill.classList.remove('is-hidden');
  const names = live.participants.map(p => studentById(p.studentId)?.name || 'Aluno');
  $('#activeWorkoutLabel').textContent = names.join(' + ');
  updateGlobalClocks();
}

function updateGlobalClocks() {
  if (live?.startedAt) {
    const elapsed = Math.max(0, (Date.now() - live.startedAt) / 1000);
    const pillClock = $('#activeWorkoutClock');
    if (pillClock) pillClock.textContent = fmtClock(elapsed);
    const liveClock = $('#liveDuration');
    if (liveClock) liveClock.textContent = fmtClock(elapsed);
  }
}

function openModal(html, { fullscreen=false, onClose=null } = {}) {
  const layer = $('#modalLayer');
  const modal = $('#modal');
  modalCloseHook = onClose;
  modal.className = `modal${fullscreen ? ' fullscreen' : ''}`;
  modal.innerHTML = fullscreen ? html : `<div class="modal-handle"></div>${html}`;
  layer.classList.remove('is-hidden');
  layer.setAttribute('aria-hidden','false');
}

function closeModal() {
  const layer = $('#modalLayer');
  layer.classList.add('is-hidden');
  layer.setAttribute('aria-hidden','true');
  $('#modal').innerHTML = '';
  if (modalCloseHook) {
    const fn = modalCloseHook;
    modalCloseHook = null;
    fn();
  }
}

function confirmModal(title, message, confirmLabel, onConfirm, danger=true) {
  openModal(`
    <h2>${esc(title)}</h2>
    <p class="modal-sub">${esc(message)}</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="confirmCancel" type="button">Cancelar</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirmOk" type="button">${esc(confirmLabel)}</button>
    </div>
  `);
  $('#confirmCancel').onclick = closeModal;
  $('#confirmOk').onclick = () => { closeModal(); onConfirm(); };
}

function dashboardData() {
  const cutoff = Date.now() - 7*86400000;
  const sessions = db.sessions.filter(s => sessionTimestamp(s) >= cutoff);
  const volume = sessions.reduce((a,s) => a + sessionVolume(s), 0);
  const sets = sessions.reduce((a,s) => a + sessionSetCount(s), 0);
  const active = new Set(sessions.flatMap(s => s.participants.map(p => p.studentId))).size;
  return { sessions, volume, sets, active };
}

function weeklyVolumeChartHtml(sessions) {
  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-(6-i));
    return { ts:d.getTime(), iso:localDateISO(d.getTime()), volume:0, count:0 };
  });
  const byIso = new Map(days.map(d=>[d.iso,d]));
  sessions.forEach(session=>{
    const day=byIso.get(localDateISO(sessionTimestamp(session)));
    if(day){day.volume+=sessionVolume(session);day.count++;}
  });
  const max=Math.max(...days.map(d=>d.volume),1);
  const total=days.reduce((a,d)=>a+d.volume,0);
  return `<div class="chart-card home-volume-card"><div class="chart-card-head"><div><strong>Volume da semana</strong><small>Volume total por dia · sem números espremidos</small></div><div class="chart-value">${compactNumber(total)} kg</div></div><div class="weekly-chart" role="img" aria-label="Volume dos últimos sete dias">${days.map(d=>`<div class="week-column"><span class="week-value">${d.volume?compactNumber(d.volume):'—'}</span><div class="week-track"><i style="height:${d.volume?Math.max(8,(d.volume/max)*100):3}%"></i></div><b>${weekdayShort(d.ts)}</b><small>${dateShort(d.ts)}</small></div>`).join('')}</div></div>`;
}

function homeInsightsHtml() {

  $('#exerciseSave').onclick = () => {
    const name = $('#exerciseName').value.trim();
    const groups = $$('[data-group].is-selected', $('#groupGrid')).map(b=>b.dataset.group);
    if (!name) return toast('Digite o nome do exercício.');
    if (!groups.length) return toast('Selecione pelo menos um grupamento.');
    const duplicate = db.exercises.some(e=>e.id!==existing?.id && e.name.toLowerCase()===name.toLowerCase());
    if (duplicate) return toast('Já existe um exercício com esse nome.');
    let saved;
    if (existing) { existing.name=name; existing.muscleGroups=groups; saved=existing; }

  const ex=exerciseById(exerciseId);if(!ex)return;

  confirmModal(`Excluir ${ex.name}?`, 'O histórico já registrado continuará preservado.', 'Excluir exercício', ()=>{
    db.exercises=db.exercises.filter(e=>e.id!==exerciseId);persist();closeModal();render();toast('Exercício excluído.');
  });
}
