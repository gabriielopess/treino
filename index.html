<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#053C6C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino">
  <meta name="format-detection" content="telephone=no">
  <title>Treino Pro</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">

  <!--
    Alterações desta etapa ficam propositalmente apenas no index.html.
    O bloco abaixo sobrescreve somente a camada visual do CSS externo.
  -->
  <style>
    :root{
      --rp-navy:#0A427E;
      --rp-navy-strong:#07355F;
      --rp-accent:#3194B9;
      --rp-accent-soft:rgba(49,148,185,.14);
      --blue:#0A427E;
      --blue-2:#3194B9;
      --blue-soft:rgba(49,148,185,.14);
    }

    html,body{background:var(--bg)!important}

    /* Identidade: azul escuro, superfícies planas e menos efeitos decorativos. */
    .btn-primary{background:var(--rp-navy)!important;color:#fff!important;box-shadow:none!important}
    .btn-primary:active{background:var(--rp-navy-strong)!important}
    .btn-secondary{box-shadow:none!important}
    .metric-card,.metric-card.highlight,.home-start-card,.avatar,.exercise-symbol,.coach-report,
    .live-exercise-card,.finish-card,.rest-timer,.active-workout-pill,.finish-check{
      background-image:none!important;
    }
    .metric-card{background:var(--surface)!important}
    .metric-card.highlight{background:rgba(49,148,185,.10)!important;border-color:rgba(49,148,185,.30)!important}
    .avatar,.exercise-symbol{background:var(--rp-accent-soft)!important;color:var(--rp-accent)!important}
    .coach-report{background:var(--surface)!important;border-color:var(--line)!important}

    .hero-kicker,.chart-value,.row-side,.history-session-head span,.home-start-copy small,.home-start-arrow,
    .quick-action svg,.live-stat strong.accent,.change-history-icon,.history-mini,.builder-exercise-name,
    .btn-ghost,.stepper button,.add-dashed{color:var(--rp-accent)!important}

    .nav-item.is-active{color:var(--rp-navy)!important;background:var(--rp-accent-soft)!important;box-shadow:none!important}
    .group-button.is-selected,.filter-chip.is-active,.period-btn.is-active{
      background:var(--rp-navy)!important;border-color:var(--rp-navy)!important;color:#fff!important
    }
    .progress-track span,.finish-muscle-row i{background:var(--rp-navy)!important}

    .home-start-card{
      background:var(--surface)!important;border:1px solid rgba(49,148,185,.28)!important;box-shadow:none!important
    }
    .home-start-icon{background:var(--rp-navy)!important;box-shadow:none!important;color:#fff!important}

    /* Dashboard: cards realmente clicáveis. */
    .metric-link{width:100%;text-align:left;color:var(--text);cursor:pointer;position:relative;transition:transform .12s ease,border-color .14s ease}
    .metric-link:active{transform:scale(.985)}
    .metric-link:after{content:'›';position:absolute;right:13px;top:12px;color:var(--faint);font-size:19px;font-weight:500}
    .metric-link:hover{border-color:rgba(49,148,185,.32)}
    .metric-list{display:flex;flex-direction:column;gap:9px;margin-top:10px}
    .metric-session-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px}
    .metric-session-row strong{display:block;font-size:13px}.metric-session-row small{display:block;color:var(--faint);font-size:10px;margin-top:4px;line-height:1.4}.metric-session-row b{font-size:11px;color:var(--rp-navy);white-space:nowrap}

    /* Ações visíveis dentro de Ver treino. */
    .program-view-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
    .program-view-actions .btn{width:100%;min-width:0;padding-left:10px;padding-right:10px}
    .program-view-actions .program-delete-action{grid-column:1/-1}

    /* Sessão ao vivo: compacta, alinhada e feita para uma mão. */
    .live-header{padding:8px 16px 7px!important;background:var(--bg)!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important}
    .live-stat-grid{gap:6px!important}
    .live-stat{padding:8px 6px!important;border-radius:12px!important;background:var(--surface)!important;border:1px solid var(--line)!important}
    .live-stat small{font-size:7px!important;letter-spacing:.06em!important}.live-stat strong{font-size:14px!important}
    .live-stat strong.accent{color:var(--rp-navy)!important}
    .live-person-head{margin:14px 16px 7px!important}.live-person-head span{font-size:11.5px!important}
    .live-person-head .avatar{width:28px!important;height:28px!important;flex-basis:28px!important}
    .live-exercise-card{margin:0 16px 10px!important;padding:12px!important;border-radius:17px!important;background:var(--surface)!important;border-color:var(--line)!important;box-shadow:none!important}
    .live-exercise-head{align-items:center!important}
    .live-exercise-head .row-main strong{font-size:15px!important;line-height:1.2!important}
    .live-exercise-head .row-main small{font-size:10px!important;margin-top:4px!important;color:var(--muted)!important}
    .live-more{width:30px!important;height:30px!important;background:var(--surface-2)!important;color:var(--muted)!important}
    .history-mini{width:26px!important;height:26px!important;background:var(--surface-2)!important;color:var(--rp-navy)!important}
    .live-note{height:31px!important;margin-top:7px!important;font-size:11.5px!important;color:var(--muted)!important}
    .live-note:focus{border-color:var(--rp-accent)!important;background:var(--rp-accent-soft)!important}
    .live-last-strip{display:flex;align-items:center;gap:5px;overflow:auto;scrollbar-width:none;margin:8px 0 1px;padding-bottom:1px}
    .live-last-strip::-webkit-scrollbar{display:none}.live-last-strip>small{flex:0 0 auto;color:var(--faint);font-size:8px;font-weight:850;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
    .live-last-chip{flex:0 0 auto;min-height:23px;padding:4px 7px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:9px}.live-last-chip b{color:var(--text);font-weight:800}

    .set-head,.set-row{display:grid!important;grid-template-columns:34px minmax(54px,1fr) minmax(50px,.92fr) 50px 38px!important;gap:6px!important;align-items:center!important}
    .set-head{padding:10px 0 5px!important;color:var(--faint)!important;font-size:7.5px!important;font-weight:850!important;text-transform:uppercase!important;letter-spacing:.04em!important;opacity:1!important}
    .set-head>span{text-align:center!important;white-space:nowrap!important}
    .set-row{padding:2px 0!important;margin:0 0 4px!important;border-radius:10px!important;background:transparent!important;transition:background .14s ease!important}
    .set-row:focus-within{background:rgba(49,148,185,.07)!important}
    .set-row.is-done{background:rgba(21,157,105,.055)!important;opacity:1!important}
    .set-index,.set-input,.set-check,.rpe-trigger{height:38px!important;border-radius:10px!important}
    .set-index{display:grid!important;place-items:center!important;background:var(--surface-2)!important;color:var(--muted)!important;font-size:11px!important;font-weight:850!important;text-align:center!important}
    .set-input{width:100%!important;min-width:0!important;padding:0 4px!important;background:var(--surface-2)!important;border:1px solid var(--line-strong)!important;text-align:center!important;font-size:13px!important;font-weight:780!important;box-shadow:none!important}
    .set-input:focus{border-color:var(--rp-accent)!important;box-shadow:0 0 0 2px rgba(49,148,185,.12)!important}
    .rpe-trigger{width:100%!important;min-width:0!important;background:var(--surface-2)!important;border:1px solid var(--line-strong)!important;color:var(--muted)!important;font-size:12px!important;font-weight:850!important;text-align:center!important;padding:0!important}
    .rpe-trigger.has-value{color:var(--rp-navy)!important;border-color:rgba(49,148,185,.38)!important;background:var(--rp-accent-soft)!important}
    .set-check{width:38px!important;background:var(--surface-2)!important;color:var(--faint)!important;display:grid!important;place-items:center!important}
    .set-check svg{width:16px!important;height:16px!important}
    .set-row.is-done .set-index,.set-row.is-done .set-check{background:var(--green)!important;color:#06251A!important}
    .set-row.is-done .set-input{background:var(--green-soft)!important;border-color:rgba(21,157,105,.28)!important}
    .set-row.is-done .rpe-trigger{border-color:rgba(21,157,105,.24)!important}
    .live-finish{gap:8px!important;margin:16px 16px 22px!important}

    /* RPE abre como uma escala na parte inferior, sem teclado. */
    .rpe-dock{position:fixed;z-index:135;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-bottom));width:calc(min(600px,100%) - 20px);max-width:580px;padding:14px;border-radius:20px;background:var(--bg-elev);border:1px solid var(--line-strong);box-shadow:0 18px 60px rgba(0,0,0,.34)}
    .rpe-dock.is-hidden{display:none!important}.rpe-dock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.rpe-dock-head>div{min-width:0}.rpe-dock-head small{display:block;color:var(--faint);font-size:8px;font-weight:900;letter-spacing:.09em}.rpe-dock-value{display:block;margin-top:2px;font-size:20px;font-weight:900;color:var(--text)}
    .rpe-dock-close{width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--muted);font-size:18px}
    .rpe-range{width:100%;accent-color:var(--rp-navy);height:28px}.rpe-scale{display:flex;justify-content:space-between;color:var(--faint);font-size:8px;font-weight:800;margin-top:-2px}.rpe-quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.rpe-quick button{height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800}.rpe-quick button.is-active{background:var(--rp-navy);color:#fff;border-color:var(--rp-navy)}.rpe-clear{margin-top:8px;width:100%;height:34px;border-radius:9px;background:transparent;color:var(--muted);font-size:10px;font-weight:750}

    /* Treino em andamento e descanso: legíveis nos dois temas. */
    .active-workout-pill{background:var(--bg-elev)!important;border-color:var(--line-strong)!important;box-shadow:0 12px 34px rgba(0,0,0,.20)!important}.active-workout-copy small{font-size:8px!important}.active-workout-copy strong{font-size:12.5px!important}.active-workout-clock{color:var(--rp-accent)!important}
    .rest-timer{background:var(--bg-elev)!important;border-color:var(--line-strong)!important;box-shadow:0 14px 38px rgba(0,0,0,.24)!important}.rest-timer-main strong{font-size:21px!important;color:var(--text)!important}.rest-timer-actions button{background:var(--surface-2)!important;color:var(--text)!important}.rest-timer-actions .rest-skip{background:var(--rp-navy)!important;color:#fff!important}

    /* Resumo final e cartão compartilhável. */
    .finish-celebration{text-align:center;padding:9px 4px 14px}.finish-check{width:54px;height:54px;border-radius:18px;margin:0 auto 10px;display:grid;place-items:center;color:#fff;background:var(--rp-navy)!important;box-shadow:none!important}.finish-check svg{width:26px;height:26px}.finish-celebration small{display:block;color:var(--rp-accent);font-size:8px;font-weight:900;letter-spacing:.14em;margin-bottom:5px}.finish-celebration h2{font-size:26px!important;letter-spacing:-.7px!important;margin:0 0 5px!important}.finish-celebration p{max-width:360px;margin:0 auto;color:var(--muted);font-size:11px;line-height:1.45}
    .finish-card{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:22px!important;padding:15px!important;margin-bottom:12px!important;box-shadow:none!important}.finish-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.finish-card-head strong{display:block;font-size:16px;font-weight:850}.finish-card-head small{display:block;color:var(--faint);font-size:9.5px;margin-top:3px}.finish-card-head>span{font-size:10.5px;color:var(--muted);font-weight:750}.finish-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.finish-stats>div{background:var(--surface-2)!important;border:1px solid var(--line)!important;border-radius:12px!important;padding:9px!important;min-width:0}.finish-stats small{display:block;color:var(--faint);font-size:7px;font-weight:850;letter-spacing:.06em}.finish-stats strong{display:block;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.finish-share-btn{width:100%;margin-top:12px}.finish-save-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

    .muscle-map-card{margin-top:14px;padding:12px;border-radius:17px;background:var(--surface-2)!important;border:1px solid var(--line)}
    .muscle-map-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}.muscle-map-head strong{display:block;font-size:12.5px}.muscle-map-head small{display:block;color:var(--faint);font-size:9px;margin-top:3px;line-height:1.35}.muscle-map-head span{font-size:8.5px;color:var(--rp-accent);font-weight:850;white-space:nowrap}
    .muscle-bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}.muscle-figure{min-width:0;text-align:center;padding:7px 2px 4px;border-radius:13px;background:var(--surface)}.muscle-figure>small{display:block;color:var(--faint);font-size:7.5px;font-weight:850;letter-spacing:.11em;margin-bottom:1px}.muscle-figure svg{width:100%;max-width:148px;height:250px;overflow:visible}.body-base{fill:var(--body-base,#27323B);stroke:var(--body-line,#3A4853);stroke-width:1}.muscle-shape{fill:var(--muscle-idle,#35414B);stroke:var(--body-line,#3A4853);stroke-width:.65;transition:fill .15s ease,fill-opacity .15s ease}.muscle-shape.is-active{fill:var(--rp-navy);fill-opacity:calc(.34 + (var(--heat,.5) * .66));stroke:var(--rp-accent)}
    .muscle-labels{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.muscle-chip{display:inline-flex;align-items:center;gap:5px;min-height:25px;padding:4px 7px;border-radius:9px;background:rgba(49,148,185,.09);border:1px solid rgba(49,148,185,.16);font-size:9px;color:var(--muted)}.muscle-chip i{width:6px;height:6px;border-radius:50%;background:var(--rp-navy)}.muscle-chip b{font-size:8.5px;color:var(--text)}

    /* Tema claro: contraste real, não apenas superfícies clareadas. */
    html[data-theme="light"]{--blue:#0A427E;--blue-2:#0A427E;--blue-soft:rgba(10,66,126,.10);--body-base:#E4EAF0;--body-line:#B7C4CF;--muscle-idle:#CFD9E1}
    html[data-theme="light"] body{background:var(--bg)!important}
    html[data-theme="light"] .btn-primary{background:#0A427E!important;color:#fff!important}
    html[data-theme="light"] .btn-secondary{background:#E8EEF3!important;border-color:#C6D2DC!important;color:#183246!important}
    html[data-theme="light"] .btn-secondary:active{background:#DDE7EE!important}
    html[data-theme="light"] .quick-action,html[data-theme="light"] .workout-card,html[data-theme="light"] .row-card,html[data-theme="light"] .card,html[data-theme="light"] .chart-card,html[data-theme="light"] .history-session,html[data-theme="light"] .choice,html[data-theme="light"] .action-item,html[data-theme="light"] .live-exercise-card,html[data-theme="light"] .finish-card{background:#fff!important;border-color:#DCE3E9!important}
    html[data-theme="light"] .home-start-card{background:#fff!important;border-color:#BFD3DF!important}
    html[data-theme="light"] .metric-card{background:#fff!important;border-color:#DCE3E9!important}
    html[data-theme="light"] .metric-card.highlight{background:#EEF6F9!important;border-color:#B9D6E2!important}
    html[data-theme="light"] .live-stat,html[data-theme="light"] .set-index,html[data-theme="light"] .set-input,html[data-theme="light"] .rpe-trigger,html[data-theme="light"] .live-last-chip,html[data-theme="light"] .finish-stats>div{background:#F0F4F7!important;border-color:#D4DEE6!important}
    html[data-theme="light"] .set-input{color:#102A3D!important}.set-input::placeholder{opacity:.58}
    html[data-theme="light"] .live-more,html[data-theme="light"] .history-mini{background:#ECF1F5!important;color:#0A427E!important}
    html[data-theme="light"] .rest-timer,html[data-theme="light"] .active-workout-pill{background:#fff!important;border-color:#C9D5DE!important;box-shadow:0 12px 34px rgba(36,55,70,.14)!important}
    html[data-theme="light"] .rest-timer-actions button{background:#E8EEF3!important;color:#183246!important}.rest-timer-actions .rest-skip{background:#0A427E!important;color:#fff!important}
    html[data-theme="light"] .rpe-dock{background:#fff;border-color:#C9D5DE;box-shadow:0 18px 52px rgba(36,55,70,.18)}
    html[data-theme="light"] .muscle-map-card{background:#F4F7F9!important;border-color:#D8E1E7}.muscle-figure{border:1px solid transparent}html[data-theme="light"] .muscle-figure{background:#fff;border-color:#E1E7EC}
    html[data-theme="light"] .muscle-chip{background:#EAF3F7;color:#416073}html[data-theme="light"] .muscle-chip b{color:#16364A}
    html[data-theme="light"] .nav-item.is-active{background:rgba(10,66,126,.10)!important;color:#0A427E!important}

    @media(max-width:390px){
      .live-exercise-card,.live-person-head,.live-finish{margin-left:12px!important;margin-right:12px!important}.live-header{padding-left:12px!important;padding-right:12px!important}
      .set-head,.set-row{grid-template-columns:31px minmax(50px,1fr) minmax(47px,.9fr) 47px 36px!important;gap:4px!important}.set-index,.set-input,.set-check,.rpe-trigger{height:37px!important}.set-check{width:36px!important}.set-input{font-size:12.5px!important}
      .muscle-figure svg{height:230px}.program-view-actions{grid-template-columns:1fr}.program-view-actions .program-delete-action{grid-column:auto}
    }
    @media(max-width:350px){.set-head,.set-row{grid-template-columns:29px minmax(45px,1fr) minmax(43px,.9fr) 44px 34px!important;gap:3px!important}.set-check{width:34px!important}.live-exercise-card{padding:10px!important}.rpe-trigger{font-size:11px!important}.muscle-figure svg{height:215px}}
  

    /* Refinamento da sessão + resumo compartilhável (referência visual enviada pelo usuário). */
    .set-input::placeholder{color:var(--text)!important;opacity:.34!important;font-weight:760!important}
    .set-input.has-suggestion::placeholder{color:var(--rp-accent)!important;opacity:.50!important}
    .set-input.has-suggestion{border-style:dashed!important}
    .finish-celebration{padding:16px 4px 12px!important;text-align:left!important}
    .finish-celebration .finish-check{display:none!important}
    .finish-celebration>small{font-size:8px!important;letter-spacing:.12em!important;color:var(--rp-accent)!important;font-weight:900!important}
    .finish-celebration h2{font-size:29px!important;margin:6px 0 4px!important;letter-spacing:-.8px!important}
    .finish-celebration p{font-size:11px!important;color:var(--muted)!important;margin:0!important}
    .finish-card{padding:16px!important;border-radius:24px!important;background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:none!important}
    .finish-card-head{display:flex!important;align-items:flex-start!important;justify-content:space-between!important;gap:12px!important}
    .finish-card-head>div{min-width:0!important}.finish-card-head strong{display:block!important;font-size:20px!important;line-height:1.1!important;letter-spacing:-.45px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.finish-card-head small{display:block!important;margin-top:5px!important;color:var(--muted)!important;font-size:10.5px!important}
    .finish-duration-pill{flex:0 0 auto!important;min-height:34px!important;padding:0 11px!important;border-radius:999px!important;background:var(--rp-accent-soft)!important;color:var(--rp-navy)!important;font-size:11px!important;font-weight:850!important;display:flex!important;align-items:center!important;justify-content:center!important;border:1px solid rgba(49,148,185,.18)!important}
    .finish-stats{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:7px!important;margin-top:14px!important}
    .finish-stats>div{padding:10px 9px!important;border-radius:14px!important;background:var(--surface-2)!important;border:1px solid var(--line)!important;min-width:0!important}.finish-stats small{display:block!important;color:var(--faint)!important;font-size:7px!important;font-weight:900!important;letter-spacing:.07em!important}.finish-stats strong{display:block!important;margin-top:5px!important;font-size:14px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
    .muscle-map-card{padding:13px 10px 10px!important;border-radius:18px!important;background:transparent!important;border:0!important;margin-top:12px!important}
    .muscle-map-head{margin:0 2px 8px!important}.muscle-map-head strong{font-size:14px!important}.muscle-map-head small{font-size:9px!important}.muscle-map-head>span{display:none!important}
    .muscle-bodies{gap:12px!important}.muscle-figure{background:transparent!important;border:0!important;padding:2px 0!important}.muscle-figure>small{font-size:7px!important;letter-spacing:.14em!important;margin-bottom:4px!important}.muscle-figure svg{height:292px!important;max-width:170px!important;filter:none!important}
    .muscle-labels{gap:6px!important;margin-top:7px!important}.muscle-chip{min-height:28px!important;padding:5px 9px!important;border-radius:999px!important;background:var(--rp-navy)!important;border:0!important;color:#fff!important;font-size:9.5px!important;font-weight:760!important}.muscle-chip i,.muscle-chip b{display:none!important}.muscle-chip span{color:#fff!important}

  'use strict';

  /* ============================================================

  function sevenDaySessions(){
    const cutoff=Date.now()-7*86400000;
    return db.sessions.filter(s=>sessionTimestamp(s)>=cutoff).sort((a,b)=>sessionTimestamp(b)-sessionTimestamp(a));
  }

  function openDashboardMetric(kind){
    if(kind==='students') return navigate('students');
    const sessions=sevenDaySessions();
    if(kind==='top'){
      const top=findTopImprovementAcrossStudents('90d');
      if(!top) return navigate('evolution');
      navigate('evolution-detail',{evolutionStudentId:top.student.id});
      setTimeout(()=>{if(typeof openExerciseHistory==='function'&&top.exerciseId)openExerciseHistory(top.student.id,top.exerciseId);},80);
      return;
    }

iv><div class="section"><div class="section-title"><h2>Ações rápidas</h2></div><div class="quick-actions"><button class="quick-action" data-quick="student" type="button">${icons.users}<strong>Novo aluno</strong><small>Cadastrar e montar treinos</small></button><button class="quick-action" data-quick="exercise" type="button">${icons.dumbbell}<strong>Novo exercício</strong><small>Adicionar à biblioteca</small></button></div></div></section>`;

    $('#viewClose').onclick=closeModal;$('#viewEdit').onclick=()=>{closeModal();setTimeout(()=>openProgramBuilder(p.studentId,p.id),50);};$('#viewCopy').onclick=()=>openProgramCopy(programId);$('#viewDelete').onclick=()=>{closeModal();setTimeout(()=>confirmDeleteProgram(programId),50);};
  };

  /* Sugestões de carga/reps ficam visíveis em tom claro e só viram valor ao editar ou concluir. */
  prepareWorkout=function(entries){
    if(live)return confirmModal('Treino em andamento','Há uma sessão aberta. Deseja voltar para ela?','Voltar ao treino',()=>navigate('workout'),false);
    const participants=[];
    for(const entry of entries){
      const st=studentById(entry.studentId),program=programById(entry.programId);if(!st||!program)return toast('Não foi possível preparar o treino.');
      participants.push({studentId:st.id,programId:program.id,programName:program.name,feedback:'',exercises:program.exercises.map((pe,index)=>{
        const ex=exerciseById(pe.exerciseId);if(!ex)return null;
        const prev=getLastExercisePerformance(st.id,ex.id),prevSets=prev?completedSets(prev):[];
        return {exerciseId:ex.id,name:ex.name,muscleGroups:ex.muscleGroups.slice(),restSec:pe.restSec,note:pe.note||'',targetReps:pe.targetReps||'',referenceWeight:pe.referenceWeight??null,sourceExerciseId:pe.exerciseId,programIndex:index,previousDetails:previousExerciseHtml(lastProgramExercise(st.id,program.id,pe,index),pe),sets:Array.from({length:pe.sets},(_,i)=>{
          const base=prevSets[i]||prevSets[prevSets.length-1]||null;
          const suggestedWeight=base&&parseDecimal(base.weight)>0?String(parseDecimal(base.weight)):(!base&&pe.referenceWeight!=null&&parseDecimal(pe.referenceWeight)>0?String(parseDecimal(pe.referenceWeight)):'');
          const suggestedReps=base&&parseInteger(base.reps)>0?String(parseInteger(base.reps)):'';
          return {weight:'',reps:'',rpe:'',done:false,autoWeight:true,autoReps:true,suggestedWeight,suggestedReps,previous:base?{weight:base.weight,reps:base.reps,rpe:base.rpe??null}:null};
        })};
      }).filter(Boolean)});
    }
    live={id:uid('draft'),createdAt:Date.now(),startedAt:null,restEndAt:null,restDuration:0,participants};persistDraft();navigate('workout');
  };

  function compactLastSetsHtml(ex){
    const rows=(ex.sets||[]).map(s=>s.previous).filter(Boolean).slice(0,4);if(!rows.length)return '';
    return `<div class="live-last-strip"><small>Último</small>${rows.map((s,i)=>`<span class="live-last-chip"><b>S${i+1}</b> ${parseDecimal(s.weight)} × ${parseInteger(s.reps)}</span>`).join('')}</div>`;
  }

  renderActiveWorkout=function(main){
    const title=live.participants.length>1?'Treino em dupla':live.participants[0].programName;

  liveParticipantHtml=function(p,pi){const st=studentById(p.studentId),pvol=p.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((x,s)=>x+setVolume(s),0),0);return `<div class="live-person-head">${avatarHtml(st)}<span>${esc(st?.name||'Aluno')} · ${esc(p.programName)} · ${kgText(pvol)}</span></div>${p.exercises.map((ex,ei)=>liveExerciseHtml(p,pi,ex,ei)).join('')}`;};

  liveExerciseHtml=function(participant,pi,ex,ei){
    const meta=[`${ex.sets.length}S`,ex.targetReps?`${esc(ex.targetReps)} reps`:'',fmtRest(ex.restSec)].filter(Boolean).join(' · ');
    return `<div class="live-exercise-card" data-live-exercise="${pi}:${ei}"><div class="live-exercise-head"><button class="live-exercise-history" type="button" data-ex-history data-ex-history-student="${esc(participant.studentId)}" data-ex-history-id="${esc(ex.exerciseId)}"><div class="row-main"><strong>${esc(ex.name)}</strong><small>${meta}</small></div><span class="history-mini">${icons.history}</span></button><button class="live-more" type="button" data-live-more="${pi}:${ei}" aria-label="Ações do exercício">⋯</button></div>${compactLastSetsHtml(ex)}${ex.note?`<input class="live-note" data-live-note="${pi}:${ei}" value="${esc(ex.note||'')}" placeholder="Observação" aria-label="Observação do exercício">`:`<input class="live-note" data-live-note="${pi}:${ei}" value="" placeholder="Observação" aria-label="Observação do exercício">`}<div class="set-head"><span>Série</span><span>kg</span><span>Reps</span><span>RPE</span><span></span></div>${ex.sets.map((set,si)=>liveSetHtml(pi,ei,set,si,ex)).join('')}</div>`;
  };

  function setSuggestion(set,key){
    const own=key==='weight'?set?.suggestedWeight:set?.suggestedReps;
    if(String(own??'').trim())return String(own);
    const prev=key==='weight'?set?.previous?.weight:set?.previous?.reps;
    return String(prev??'').trim();
  }

  liveSetHtml=function(pi,ei,set,si,ex){
    const path=`${pi}:${ei}:${si}`,rpe=set.rpe===''||set.rpe==null?'':Number(set.rpe),sw=setSuggestion(set,'weight'),sr=setSuggestion(set,'reps');
    return `<div class="set-row ${set.done?'is-done':''}" data-set-row="${path}"><div class="set-index">${si+1}</div><input class="set-input ${!set.weight&&sw?'has-suggestion':''}" inputmode="decimal" data-set-weight="${path}" value="${esc(set.weight)}" placeholder="${esc(sw||'kg')}" aria-label="Carga da série ${si+1}"><input class="set-input ${!set.reps&&sr?'has-suggestion':''}" inputmode="numeric" data-set-reps="${path}" value="${esc(set.reps)}" placeholder="${esc(sr||'reps')}" aria-label="Repetições da série ${si+1}"><button class="rpe-trigger ${rpe?'has-value':''}" type="button" data-set-rpe-trigger="${path}" aria-label="RPE da série ${si+1}">${rpe?String(rpe).replace('.5','½'):'—'}</button><button class="set-check" data-set-check="${path}" type="button" aria-label="${set.done?'Desmarcar':'Concluir'} série ${si+1}">${set.done?icons.check:''}</button></div>`;
  };

  function ensureRpeDock(){
    let dock=$('#rpeDock');if(dock)return dock;
    dock=document.createElement('div');dock.id='rpeDock';dock.className='rpe-dock is-hidden';dock.innerHTML=`<div class="rpe-dock-head"><div><small>PERCEPÇÃO DE ESFORÇO</small><strong class="rpe-dock-value" id="rpeDockValue">RPE 8</strong></div><button class="rpe-dock-close" id="rpeDockClose" type="button" aria-label="Fechar">×</button></div><input id="rpeRange" class="rpe-range" type="range" min="1" max="10" step="0.5" value="8"><div class="rpe-scale"><span>1</span><span>5</span><span>10</span></div><div class="rpe-quick">${[6,7,8,9,10].map(v=>`<button type="button" data-rpe-quick="${v}">${v}</button>`).join('')}</div><button class="rpe-clear" id="rpeClear" type="button">Limpar RPE</button>`;document.body.appendChild(dock);$('#rpeDockClose').onclick=closeRpePicker;return dock;
  }
  let activeRpePath=null;
  function rpeLabel(v){const n=Number(v);return Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',');}
  function syncRpeDock(value){const n=clamp(Number(value)||8,1,10);$('#rpeRange').value=n;$('#rpeDockValue').textContent=`RPE ${rpeLabel(n)}`;$$('[data-rpe-quick]',$('#rpeDock')).forEach(b=>b.classList.toggle('is-active',Number(b.dataset.rpeQuick)===n));}
  function applyRpeValue(value){if(!activeRpePath)return;const set=liveSetAt(activeRpePath);if(!set)return;const n=clamp(Number(value),1,10);set.rpe=n;persistDraft();const btn=$(`[data-set-rpe-trigger="${activeRpePath}"]`);if(btn){btn.textContent=String(n).replace('.5','½');btn.classList.add('has-value');}syncRpeDock(n);}
  function openRpePicker(path){activeRpePath=path;const dock=ensureRpeDock(),set=liveSetAt(path),value=set?.rpe||8;syncRpeDock(value);dock.classList.remove('is-hidden');$('#rpeRange').oninput=e=>applyRpeValue(e.target.value);$$('[data-rpe-quick]',dock).forEach(btn=>btn.onclick=()=>applyRpeValue(btn.dataset.rpeQuick));$('#rpeClear').onclick=()=>{const s=liveSetAt(activeRpePath);if(s){s.rpe='';persistDraft();const b=$(`[data-set-rpe-trigger="${activeRpePath}"]`);if(b){b.textContent='—';b.classList.remove('has-value');}}closeRpePicker();};}
  function closeRpePicker(){const dock=$('#rpeDock');if(dock)dock.classList.add('is-hidden');activeRpePath=null;}

  function nearestCurrentSet(pi,ei,si){const ex=live?.participants?.[pi]?.exercises?.[ei];if(!ex)return null;for(let i=si-1;i>=0;i--){const s=ex.sets[i];if(parseDecimal(s.weight)>0||parseInteger(s.reps)>0)return s;}return null;}
  function syncSetInputs(path,set){
    const w=$(`[data-set-weight="${path}"]`),r=$(`[data-set-reps="${path}"]`);
    if(w){w.value=set.weight??'';w.placeholder=setSuggestion(set,'weight')||'kg';w.classList.toggle('has-suggestion',!w.value&&!!setSuggestion(set,'weight'));}
    if(r){r.value=set.reps??'';r.placeholder=setSuggestion(set,'reps')||'reps';r.classList.toggle('has-suggestion',!r.value&&!!setSuggestion(set,'reps'));}
  }
  function consumeSuggestion(set,key){
    if(key==='weight'){
      const n=parseDecimal(setSuggestion(set,'weight'));if(n>0){set.weight=String(n);return true;}
    }else{
      const n=parseInteger(setSuggestion(set,'reps'));if(n>0){set.reps=String(n);return true;}
    }
    return false;
  }
  function suggestNextSet(pi,ei,si,current){
    const ex=live?.participants?.[pi]?.exercises?.[ei],next=ex?.sets?.[si+1];if(!next)return;
    if(next.autoWeight!==false&&parseDecimal(current.weight)>0&&!String(next.weight||'').trim())next.suggestedWeight=String(parseDecimal(current.weight));
    if(next.autoReps!==false&&parseInteger(current.reps)>0&&!String(next.reps||'').trim())next.suggestedReps=String(parseInteger(current.reps));
    syncSetInputs(`${pi}:${ei}:${si+1}`,next);
  }

  bindLiveHandlers=function(){
    $$('[data-set-weight]').forEach(inp=>inp.oninput=()=>{const path=inp.dataset.setWeight,s=liveSetAt(path);if(s){s.weight=inp.value;s.autoWeight=false;const [pi,ei,si]=parsePath(path);suggestNextSet(pi,ei,si,s);persistDraft();updateLiveStatsDOM();}});
    $$('[data-set-reps]').forEach(inp=>inp.oninput=()=>{const path=inp.dataset.setReps,s=liveSetAt(path);if(s){s.reps=inp.value;s.autoReps=false;const [pi,ei,si]=parsePath(path);suggestNextSet(pi,ei,si,s);persistDraft();updateLiveStatsDOM();}});
    $$('[data-set-rpe-trigger]').forEach(btn=>btn.onclick=()=>openRpePicker(btn.dataset.setRpeTrigger));
    $$('[data-set-check]').forEach(btn=>btn.onclick=()=>{
      const path=btn.dataset.setCheck,set=liveSetAt(path);if(!set)return;const [pi,ei,si]=parsePath(path);
      if(!set.done){
        const prior=nearestCurrentSet(pi,ei,si);
        if(parseDecimal(set.weight)<=0&&!consumeSuggestion(set,'weight')){if(prior&&parseDecimal(prior.weight)>0)set.weight=String(parseDecimal(prior.weight));}
        if(parseInteger(set.reps)<=0&&!consumeSuggestion(set,'reps')){if(prior&&parseInteger(prior.reps)>0)set.reps=String(parseInteger(prior.reps));}
        if(parseInteger(set.reps)<=0)return toast('Informe as repetições antes de concluir a série.');
        syncSetInputs(path,set);
      }
      set.done=!set.done;
      if(set.done){suggestNextSet(pi,ei,si,set);unlockAudio();const ex=live.participants[pi].exercises[ei];if(ex.restSec>0)startRest(ex.restSec);}
      persistDraft();const row=btn.closest('.set-row');row?.classList.toggle('is-done',set.done);btn.innerHTML=set.done?icons.check:'';btn.setAttribute('aria-label',`${set.done?'Desmarcar':'Concluir'} série ${si+1}`);updateLiveStatsDOM();
    });
    $$('[data-live-note]').forEach(inp=>inp.oninput=()=>{const ex=liveExerciseAt(inp.dataset.liveNote);if(ex){ex.note=inp.value;persistDraft();}});

  function liveMuscleStats(participant){
    const map=new Map();
    (participant.exercises||[]).forEach(ex=>{const done=(ex.sets||[]).filter(s=>s.done);if(!done.length)return;const groups=normalizeGroups(ex.muscleGroups),divisor=Math.max(groups.length,1),volume=done.reduce((sum,s)=>sum+setVolume(s),0);groups.forEach(group=>{if(!map.has(group))map.set(group,{group,volume:0,sets:0,score:0});const row=map.get(group);row.volume+=volume/divisor;row.sets+=done.length/divisor;row.score+=(volume>0?volume:done.length*100)/divisor;});});
    const rows=[...map.values()].sort((a,b)=>b.score-a.score),max=Math.max(...rows.map(r=>r.score),1);rows.forEach(r=>r.heat=clamp(r.score/max,.22,1));return rows;
  }
  function muscleHeat(stats,name){return stats.find(r=>r.group===name)?.heat||0;}
  function anatomyPalette(forShare=false){
    const dark=currentTheme()==='dark';
    if(dark)return {base:forShare?'#8D969D':'#8A949C',idle:forShare?'#8D969D':'#8A949C',line:forShare?'#5E6972':'#5C6872',detail:forShare?'#66727B':'#64717A',active:'#148BD6',activeStrong:'#0A6FB6'};
    return {base:'#D9DEE2',idle:'#D9DEE2',line:'#A8B3BC',detail:'#B3BDC4',active:'#0A6FB6',activeStrong:'#084F85'};
  }
  function anatomyMuscleFill(stats,name,pal){const h=muscleHeat(stats,name);if(!h)return pal.idle;const a=.52+.48*h;const hex=pal.active.replace('#',''),idle=pal.idle.replace('#','');const rgb=x=>[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)],A=rgb(hex),B=rgb(idle),mix=A.map((v,i)=>Math.round(B[i]+(v-B[i])*a));return `rgb(${mix.join(',')})`;}
  function muscleAttr(stats,name,pal){return `fill="${anatomyMuscleFill(stats,name,pal)}" stroke="${pal.line}" stroke-width=".75"`;}

Number(points[i].value)}</text><text x="${p.x}" y="${B+27}" text-anchor="middle" class="chart-x-label">${esc(points[i].date)}</text></g>`).join('');return `<div class="chart-card program-volume-card" data-chart-points='${esc(JSON.stringify(points))}'><div class="chart-card-head"><div><strong>Evolução do volume</strong></div><div class="chart-value">${compactNumber(points[points.length-1].value)} kg</div></div>${select}<div class="chart-scroll"><svg class="detail-line-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grid}<path d="${line}" class="chart-line"/>${dots}</svg></div></div>`;}
function explainEvolutionMetric(kind,ctx){const {period,sessions,sets,uniqueExercises,topGain}=ctx,label={'30d':'30 dias','90d':'3 meses','180d':'6 meses','365d':'1 ano','all':'todo o histórico'}[period]||period;const rows={sessions:['Treinos',`${sessions.length} sessões`,`Período`,label,'Cálculo','Quantidade de sessões registradas para o aluno no período selecionado.'],sets:['Séries',`${sets} séries`,`Período`,label,'Cálculo','Soma das séries concluídas nas sessões consideradas.'],exercises:['Exercícios',`${uniqueExercises} exercícios`,`Período`,label,'Cálculo','Quantidade de exercícios distintos com séries registradas.'],gain:['Maior evolução',topGain?`${topGain.firstKg} kg → ${topGain.lastKg} kg (${topGain.deltaKg>0?'+':''}${round(topGain.deltaKg)} kg)`:'Sem comparação',`Período`,label,'Cálculo','Compara a maior carga do primeiro e do último registro do mesmo exercício no período.']}[kind];if(!rows)return;openModal(`<h2>${rows[0]}</h2><div class="metric-explain"><div class="metric-explain-row"><small>VALOR</small><strong>${esc(rows[1])}</strong></div><div class="metric-explain-row"><small>${esc(rows[2].toUpperCase())}</small><strong>${esc(rows[3])}</strong></div><div class="metric-explain-row"><small>${esc(rows[4].toUpperCase())}</small><strong>${esc(rows[5])}</strong></div></div><div class="modal-actions"><button class="btn btn-primary" id="metricExplainClose">Fechar</button></div>`);$('#metricExplainClose').onclick=closeModal;}
renderEvolutionDetail=function(main,studentId){const st=studentById(studentId);if(!st)return navigate('evolution');setHeader({eyebrow:'EVOLUÇÃO',title:st.name,back:()=>navigate('evolution'),action:null});const period=state.evolutionPeriod,sessions=sessionsForStudent(st.id,period),participants=sessions.map(s=>({session:s,p:participantForStudent(s,st.id)})),sets=participants.reduce((a,x)=>a+participantSetCount(x.p),0),uniqueExercises=new Set(participants.flatMap(x=>(x.p.exercises||[]).map(ex=>ex.exerciseId))).size,changes=exerciseChanges(st.id,period),gains=changes.filter(x=>x.deltaKg>0).sort((a,b)=>b.pct-a.pct),downs=changes.filter(x=>x.deltaKg<0).sort((a,b)=>a.pct-b.pct),muscles=muscleDistribution(st.id,period),comparable=changes.slice().sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct)),programs=programsForStudent(st.id);if(!state.evolutionProgramId)state.evolutionProgramId=recentEvolutionProgramId(st.id,period);if(state.evolutionProgramId&&!programs.some(p=>p.id===state.evolutionProgramId))state.evolutionProgramId=recentEvolutionProgramId(st.id,period);const selectedProgram=state.evolutionProgramId?programById(state.evolutionProgramId):null,programParticipants=selectedProgram?participants.filter(x=>x.p.programId===selectedProgram.id):[],topGain=gains[0]||null,ctx={period,sessions,sets,uniqueExercises,topGain};main.innerHTML=`<section class="screen"><div class="evo-person-head">${avatarHtml(st)}<div><small>EVOLUÇÃO INDIVIDUAL</small><h1>${esc(st.name)}</h1></div></div><div class="evo-filter-row">${[['30d','30 dias'],['90d','3 meses'],['180d','6 meses'],['365d','1 ano'],['all','Tudo']].map(([v,l])=>`<button class="period-btn ${period===v?'is-active':''}" data-period="${v}">${l}</button>`).join('')}</div><div class="section evolution-summary" style="margin-top:0"><div class="grid-2"><button class="metric-card evo-metric-link" data-evo-metric="sessions"><div><small>Treinos</small><strong>${sessions.length}</strong></div><p>no período</p></button><button class="metric-card evo-metric-link" data-evo-metric="sets"><div><small>Séries</small><strong>${sets}</strong></div><p>concluídas</p></button><button class="metric-card evo-metric-link" data-evo-metric="exercises"><div><small>Exercícios</small><strong>${uniqueExercises}</strong></div><p>com registro</p></button><button class="metric-card highlight evo-metric-link" data-evo-metric="gain"><div><small>Maior evolução</small><strong>${topGain?`+${round(topGain.deltaKg)} kg`:'—'}</strong></div><p>${topGain?esc(topGain.exerciseName):'sem comparação'}</p></button></div></div>${evolutionVolumeChart(programParticipants,selectedProgram,programs.length)}<div class="chart-card"><div class="chart-card-head"><div><strong>Volume por grupamento</strong></div></div>${muscles.length?muscles.map(muscleRowHtml).join(''):emptyHtml('Sem dados de grupamentos.')}</div><div class="chart-card"><div class="chart-card-head"><div><strong>Evolução por exercício</strong></div><span class="chart-hint">${comparable.length} comparáveis</span></div><div class="change-list">${comparable.length?comparable.slice(0,10).map(x=>changeRowHtml(x,x.deltaKg<0,st.id)).join(''):emptyHtml('Sem comparação suficiente.')}</div></div></section>`;$$('[data-period]',main).forEach(btn=>btn.onclick=()=>{state.evolutionPeriod=btn.dataset.period;state.evolutionProgramId=null;renderEvolutionDetail(main,st.id);});$('#evoProgramSelect')?.addEventListener('click',()=>openEvolutionProgramPicker(st.id));$$('[data-evo-metric]',main).forEach(btn=>btn.onclick=()=>explainEvolutionMetric(btn.dataset.evoMetric,ctx));$$('[data-chart-point]',main).forEach(pt=>{const fire=()=>{const card=pt.closest('[data-chart-points]'),arr=JSON.parse(card?.dataset.chartPoints||'[]'),row=arr[+pt.dataset.chartPoint];if(row)toast(`${row.fullDate} · ${kgText(row.value)}`);};pt.onclick=fire;pt.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fire();}};});requestAnimationFrame(()=>{const scroll=main.querySelector('.program-volume-card .chart-scroll');if(scroll&&scroll.scrollWidth>scroll.clientWidth)scroll.scrollLeft=scroll.scrollWidth;});};

/* Final summary reuses the same card structure, then adds share actions. */
openFinishWorkout=function(){if(!live)return;const completed=live.participants.reduce((a,p)=>a+p.exercises.reduce((x,e)=>x+e.sets.filter(s=>s.done).length,0),0);if(!completed)return toast('Marque pelo menos uma série como concluída.');const now=Date.now(),session={endedAt:now,startedAt:live.startedAt||now,durationSec:Math.max(0,Math.round((now-(live.startedAt||now))/1000))};openModal(`<div class="finish-celebration"><small>TREINO CONCLUÍDO</small><h2>Parabéns!</h2></div>${live.participants.map((p,i)=>`${summaryParticipantCard(session,p,i)}<button class="btn btn-secondary finish-share-btn" type="button" data-save-summary="${i}">Salvar imagem</button>`).join('')}<div class="modal-actions"><button class="btn btn-secondary" id="finishCancel">Voltar</button><button class="btn btn-primary" id="finishSave">Salvar treino</button></div>`,{fullscreen:true});$('#finishCancel').onclick=closeModal;$('#finishSave').onclick=saveFinishedWorkout;$$('[data-save-summary]',$('#modal')).forEach(btn=>btn.onclick=()=>saveWorkoutSummaryImage(+btn.dataset.saveSummary));hydrateAnatomyMaps($('#modal'),live.participants).catch(()=>{});};

/* Preserve existing paired associations, but don't show them as a student identity label. */
const __studentRowHtml=studentRowHtml;
studentRowHtml=function(student){const programs=programsForStudent(student.id).length,last=latestStudentSession(student.id);return `<button class="row-card" type="button" data-student-id="${esc(student.id)}">${avatarHtml(student)}<div class="row-main"><strong>${esc(student.name)}</strong><small>${esc(student.modality||'Presencial')} · ${programs} treino${programs===1?'':'s'} · ${last?`última sessão ${daysAgo(sessionTimestamp(last))}`:'sem sessões'}</small></div>${chev()}</button>`;};

/* Run the route decoration once after this patch. */
requestAnimationFrame(()=>{try{render();}catch(e){console.error(e);}});
})();

</script>
