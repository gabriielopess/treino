<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#053C6C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino">
  <meta name="format-detection" content="telephone=no">
  <title>Treino Pro</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">

  <!--
    Alterações desta etapa ficam propositalmente apenas no index.html.
    O bloco abaixo sobrescreve somente a camada visual do CSS externo.
  -->
  <style>
    :root{
      --rp-navy:#0A427E;
      --rp-navy-strong:#07355F;
      --rp-accent:#3194B9;
      --rp-accent-soft:rgba(49,148,185,.14);
      --blue:#0A427E;
      --blue-2:#3194B9;
      --blue-soft:rgba(49,148,185,.14);
    }

    html,body{background:var(--bg)!important}

    /* Identidade: azul escuro, superfícies planas e menos efeitos decorativos. */
    .btn-primary{background:var(--rp-navy)!important;color:#fff!important;box-shadow:none!important}
    .btn-primary:active{background:var(--rp-navy-strong)!important}
    .btn-secondary{box-shadow:none!important}
    .metric-card,.metric-card.highlight,.home-start-card,.avatar,.exercise-symbol,.coach-report,
    .live-exercise-card,.finish-card,.rest-timer,.active-workout-pill,.finish-check{
      background-image:none!important;
    }
    .metric-card{background:var(--surface)!important}
    .metric-card.highlight{background:rgba(49,148,185,.10)!important;border-color:rgba(49,148,185,.30)!important}
    .avatar,.exercise-symbol{background:var(--rp-accent-soft)!important;color:var(--rp-accent)!important}
    .coach-report{background:var(--surface)!important;border-color:var(--line)!important}

    .hero-kicker,.chart-value,.row-side,.history-session-head span,.home-start-copy small,.home-start-arrow,
    .quick-action svg,.live-stat strong.accent,.change-history-icon,.history-mini,.builder-exercise-name,
    .btn-ghost,.stepper button,.add-dashed{color:var(--rp-accent)!important}

    .nav-item.is-active{color:var(--rp-navy)!important;background:var(--rp-accent-soft)!important;box-shadow:none!important}
    .group-button.is-selected,.filter-chip.is-active,.period-btn.is-active{
      background:var(--rp-navy)!important;border-color:var(--rp-navy)!important;color:#fff!important
    }
    .progress-track span,.finish-muscle-row i{background:var(--rp-navy)!important}

    .home-start-card{
      background:var(--surface)!important;border:1px solid rgba(49,148,185,.28)!important;box-shadow:none!important
    }
    .home-start-icon{background:var(--rp-navy)!important;box-shadow:none!important;color:#fff!important}

    /* Dashboard: cards realmente clicáveis. */
    .metric-link{width:100%;text-align:left;color:var(--text);cursor:pointer;position:relative;transition:transform .12s ease,border-color .14s ease}
    .metric-link:active{transform:scale(.985)}
    .metric-link:after{content:'›';position:absolute;right:13px;top:12px;color:var(--faint);font-size:19px;font-weight:500}
    .metric-link:hover{border-color:rgba(49,148,185,.32)}
    .metric-list{display:flex;flex-direction:column;gap:9px;margin-top:10px}
    .metric-session-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px}
    .metric-session-row strong{display:block;font-size:13px}.metric-session-row small{display:block;color:var(--faint);font-size:10px;margin-top:4px;line-height:1.4}.metric-session-row b{font-size:11px;color:var(--rp-navy);white-space:nowrap}

    /* Ações visíveis dentro de Ver treino. */
    .program-view-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
    .program-view-actions .btn{width:100%;min-width:0;padding-left:10px;padding-right:10px}
    .program-view-actions .program-delete-action{grid-column:1/-1}

    /* Sessão ao vivo: compacta, alinhada e feita para uma mão. */
    .live-header{padding:8px 16px 7px!important;background:var(--bg)!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important}
    .live-stat-grid{gap:6px!important}
    .live-stat{padding:8px 6px!important;border-radius:12px!important;background:var(--surface)!important;border:1px solid var(--line)!important}
    .live-stat small{font-size:7px!important;letter-spacing:.06em!important}.live-stat strong{font-size:14px!important}
    .live-stat strong.accent{color:var(--rp-navy)!important}
    .live-person-head{margin:14px 16px 7px!important}.live-person-head span{font-size:11.5px!important}
    .live-person-head .avatar{width:28px!important;height:28px!important;flex-basis:28px!important}
    .live-exercise-card{margin:0 16px 10px!important;padding:12px!important;border-radius:17px!important;background:var(--surface)!important;border-color:var(--line)!important;box-shadow:none!important}
    .live-exercise-head{align-items:center!important}
    .live-exercise-head .row-main strong{font-size:15px!important;line-height:1.2!important}
    .live-exercise-head .row-main small{font-size:10px!important;margin-top:4px!important;color:var(--muted)!important}
    .live-more{width:30px!important;height:30px!important;background:var(--surface-2)!important;color:var(--muted)!important}
    .history-mini{width:26px!important;height:26px!important;background:var(--surface-2)!important;color:var(--rp-navy)!important}
    .live-note{height:31px!important;margin-top:7px!important;font-size:11.5px!important;color:var(--muted)!important}
    .live-note:focus{border-color:var(--rp-accent)!important;background:var(--rp-accent-soft)!important}
    .live-last-strip{display:flex;align-items:center;gap:5px;overflow:auto;scrollbar-width:none;margin:8px 0 1px;padding-bottom:1px}
    .live-last-strip::-webkit-scrollbar{display:none}.live-last-strip>small{flex:0 0 auto;color:var(--faint);font-size:8px;font-weight:850;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
    .live-last-chip{flex:0 0 auto;min-height:23px;padding:4px 7px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:9px}.live-last-chip b{color:var(--text);font-weight:800}

    .set-head,.set-row{display:grid!important;grid-template-columns:34px minmax(54px,1fr) minmax(50px,.92fr) 50px 38px!important;gap:6px!important;align-items:center!important}
    .set-head{padding:10px 0 5px!important;color:var(--faint)!important;font-size:7.5px!important;font-weight:850!important;text-transform:uppercase!important;letter-spacing:.04em!important;opacity:1!important}
    .set-head>span{text-align:center!important;white-space:nowrap!important}
    .set-row{padding:2px 0!important;margin:0 0 4px!important;border-radius:10px!important;background:transparent!important;transition:background .14s ease!important}
    .set-row:focus-within{background:rgba(49,148,185,.07)!important}
    .set-row.is-done{background:rgba(21,157,105,.055)!important;opacity:1!important}
    .set-index,.set-input,.set-check,.rpe-trigger{height:38px!important;border-radius:10px!important}
    .set-index{display:grid!important;place-items:center!important;background:var(--surface-2)!important;color:var(--muted)!important;font-size:11px!important;font-weight:850!important;text-align:center!important}
    .set-input{width:100%!important;min-width:0!important;padding:0 4px!important;background:var(--surface-2)!important;border:1px solid var(--line-strong)!important;text-align:center!important;font-size:13px!important;font-weight:780!important;box-shadow:none!important}
    .set-input:focus{border-color:var(--rp-accent)!important;box-shadow:0 0 0 2px rgba(49,148,185,.12)!important}
    .rpe-trigger{width:100%!important;min-width:0!important;background:var(--surface-2)!important;border:1px solid var(--line-strong)!important;color:var(--muted)!important;font-size:12px!important;font-weight:850!important;text-align:center!important;padding:0!important}
    .rpe-trigger.has-value{color:var(--rp-navy)!important;border-color:rgba(49,148,185,.38)!important;background:var(--rp-accent-soft)!important}
    .set-check{width:38px!important;background:var(--surface-2)!important;color:var(--faint)!important;display:grid!important;place-items:center!important}
    .set-check svg{width:16px!important;height:16px!important}
    .set-row.is-done .set-index,.set-row.is-done .set-check{background:var(--green)!important;color:#06251A!important}
    .set-row.is-done .set-input{background:var(--green-soft)!important;border-color:rgba(21,157,105,.28)!important}
    .set-row.is-done .rpe-trigger{border-color:rgba(21,157,105,.24)!important}
    .live-finish{gap:8px!important;margin:16px 16px 22px!important}

    /* RPE abre como uma escala na parte inferior, sem teclado. */
    .rpe-dock{position:fixed;z-index:135;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-bottom));width:calc(min(600px,100%) - 20px);max-width:580px;padding:14px;border-radius:20px;background:var(--bg-elev);border:1px solid var(--line-strong);box-shadow:0 18px 60px rgba(0,0,0,.34)}
    .rpe-dock.is-hidden{display:none!important}.rpe-dock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.rpe-dock-head>div{min-width:0}.rpe-dock-head small{display:block;color:var(--faint);font-size:8px;font-weight:900;letter-spacing:.09em}.rpe-dock-value{display:block;margin-top:2px;font-size:20px;font-weight:900;color:var(--text)}
    .rpe-dock-close{width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--muted);font-size:18px}
    .rpe-range{width:100%;accent-color:var(--rp-navy);height:28px}.rpe-scale{display:flex;justify-content:space-between;color:var(--faint);font-size:8px;font-weight:800;margin-top:-2px}.rpe-quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.rpe-quick button{height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800}.rpe-quick button.is-active{background:var(--rp-navy);color:#fff;border-color:var(--rp-navy)}.rpe-clear{margin-top:8px;width:100%;height:34px;border-radius:9px;background:transparent;color:var(--muted);font-size:10px;font-weight:750}

    /* Treino em andamento e descanso: legíveis nos dois temas. */
    .active-workout-pill{background:var(--bg-elev)!important;border-color:var(--line-strong)!important;box-shadow:0 12px 34px rgba(0,0,0,.20)!important}.active-workout-copy small{font-size:8px!important}.active-workout-copy strong{font-size:12.5px!important}.active-workout-clock{color:var(--rp-accent)!important}
    .rest-timer{background:var(--bg-elev)!important;border-color:var(--line-strong)!important;box-shadow:0 14px 38px rgba(0,0,0,.24)!important}.rest-timer-main strong{font-size:21px!important;color:var(--text)!important}.rest-timer-actions button{background:var(--surface-2)!important;color:var(--text)!important}.rest-timer-actions .rest-skip{background:var(--rp-navy)!important;color:#fff!important}

    /* Resumo final e cartão compartilhável. */
    .finish-celebration{text-align:center;padding:9px 4px 14px}.finish-check{width:54px;height:54px;border-radius:18px;margin:0 auto 10px;display:grid;place-items:center;color:#fff;background:var(--rp-navy)!important;box-shadow:none!important}.finish-check svg{width:26px;height:26px}.finish-celebration small{display:block;color:var(--rp-accent);font-size:8px;font-weight:900;letter-spacing:.14em;margin-bottom:5px}.finish-celebration h2{font-size:26px!important;letter-spacing:-.7px!important;margin:0 0 5px!important}.finish-celebration p{max-width:360px;margin:0 auto;color:var(--muted);font-size:11px;line-height:1.45}
    .finish-card{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:22px!important;padding:15px!important;margin-bottom:12px!important;box-shadow:none!important}.finish-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.finish-card-head strong{display:block;font-size:16px;font-weight:850}.finish-card-head small{display:block;color:var(--faint);font-size:9.5px;margin-top:3px}.finish-card-head>span{font-size:10.5px;color:var(--muted);font-weight:750}.finish-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.finish-stats>div{background:var(--surface-2)!important;border:1px solid var(--line)!important;border-radius:12px!important;padding:9px!important;min-width:0}.finish-stats small{display:block;color:var(--faint);font-size:7px;font-weight:850;letter-spacing:.06em}.finish-stats strong{display:block;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.finish-share-btn{width:100%;margin-top:12px}.finish-save-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

    .muscle-map-card{margin-top:14px;padding:12px;border-radius:17px;background:var(--surface-2)!important;border:1px solid var(--line)}
    .muscle-map-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}.muscle-map-head strong{display:block;font-size:12.5px}.muscle-map-head small{display:block;color:var(--faint);font-size:9px;margin-top:3px;line-height:1.35}.muscle-map-head span{font-size:8.5px;color:var(--rp-accent);font-weight:850;white-space:nowrap}
    .muscle-bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}.muscle-figure{min-width:0;text-align:center;padding:7px 2px 4px;border-radius:13px;background:var(--surface)}.muscle-figure>small{display:block;color:var(--faint);font-size:7.5px;font-weight:850;letter-spacing:.11em;margin-bottom:1px}.muscle-figure svg{width:100%;max-width:148px;height:250px;overflow:visible}.body-base{fill:var(--body-base,#27323B);stroke:var(--body-line,#3A4853);stroke-width:1}.muscle-shape{fill:var(--muscle-idle,#35414B);stroke:var(--body-line,#3A4853);stroke-width:.65;transition:fill .15s ease,fill-opacity .15s ease}.muscle-shape.is-active{fill:var(--rp-navy);fill-opacity:calc(.34 + (var(--heat,.5) * .66));stroke:var(--rp-accent)}
    .muscle-labels{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.muscle-chip{display:inline-flex;align-items:center;gap:5px;min-height:25px;padding:4px 7px;border-radius:9px;background:rgba(49,148,185,.09);border:1px solid rgba(49,148,185,.16);font-size:9px;color:var(--muted)}.muscle-chip i{width:6px;height:6px;border-radius:50%;background:var(--rp-navy)}.muscle-chip b{font-size:8.5px;color:var(--text)}

    /* Tema claro: contraste real, não apenas superfícies clareadas. */
    html[data-theme="light"]{--blue:#0A427E;--blue-2:#0A427E;--blue-soft:rgba(10,66,126,.10);--body-base:#E4EAF0;--body-line:#B7C4CF;--muscle-idle:#CFD9E1}
    html[data-theme="light"] body{background:var(--bg)!important}
    html[data-theme="light"] .btn-primary{background:#0A427E!important;color:#fff!important}
    html[data-theme="light"] .btn-secondary{background:#E8EEF3!important;border-color:#C6D2DC!important;color:#183246!important}
    html[data-theme="light"] .btn-secondary:active{background:#DDE7EE!important}
    html[data-theme="light"] .quick-action,html[data-theme="light"] .workout-card,html[data-theme="light"] .row-card,html[data-theme="light"] .card,html[data-theme="light"] .chart-card,html[data-theme="light"] .history-session,html[data-theme="light"] .choice,html[data-theme="light"] .action-item,html[data-theme="light"] .live-exercise-card,html[data-theme="light"] .finish-card{background:#fff!important;border-color:#DCE3E9!important}
    html[data-theme="light"] .home-start-card{background:#fff!important;border-color:#BFD3DF!important}
    html[data-theme="light"] .metric-card{background:#fff!important;border-color:#DCE3E9!important}
    html[data-theme="light"] .metric-card.highlight{background:#EEF6F9!important;border-color:#B9D6E2!important}
    html[data-theme="light"] .live-stat,html[data-theme="light"] .set-index,html[data-theme="light"] .set-input,html[data-theme="light"] .rpe-trigger,html[data-theme="light"] .live-last-chip,html[data-theme="light"] .finish-stats>div{background:#F0F4F7!important;border-color:#D4DEE6!important}
    html[data-theme="light"] .set-input{color:#102A3D!important}.set-input::placeholder{opacity:.58}
    html[data-theme="light"] .live-more,html[data-theme="light"] .history-mini{background:#ECF1F5!important;color:#0A427E!important}
    html[data-theme="light"] .rest-timer,html[data-theme="light"] .active-workout-pill{background:#fff!important;border-color:#C9D5DE!important;box-shadow:0 12px 34px rgba(36,55,70,.14)!important}
    html[data-theme="light"] .rest-timer-actions button{background:#E8EEF3!important;color:#183246!important}.rest-timer-actions .rest-skip{background:#0A427E!important;color:#fff!important}
    html[data-theme="light"] .rpe-dock{background:#fff;border-color:#C9D5DE;box-shadow:0 18px 52px rgba(36,55,70,.18)}
    html[data-theme="light"] .muscle-map-card{background:#F4F7F9!important;border-color:#D8E1E7}.muscle-figure{border:1px solid transparent}html[data-theme="light"] .muscle-figure{background:#fff;border-color:#E1E7EC}
    html[data-theme="light"] .muscle-chip{background:#EAF3F7;color:#416073}html[data-theme="light"] .muscle-chip b{color:#16364A}
    html[data-theme="light"] .nav-item.is-active{background:rgba(10,66,126,.10)!important;color:#0A427E!important}

    @media(max-width:390px){
      .live-exercise-card,.live-person-head,.live-finish{margin-left:12px!important;margin-right:12px!important}.live-header{padding-left:12px!important;padding-right:12px!important}
      .set-head,.set-row{grid-template-columns:31px minmax(50px,1fr) minmax(47px,.9fr) 47px 36px!important;gap:4px!important}.set-index,.set-input,.set-check,.rpe-trigger{height:37px!important}.set-check{width:36px!important}.set-input{font-size:12.5px!important}
      .muscle-figure svg{height:230px}.program-view-actions{grid-template-columns:1fr}.program-view-actions .program-delete-action{grid-column:auto}
    }
    @media(max-width:350px){.set-head,.set-row{grid-template-columns:29px minmax(45px,1fr) minmax(43px,.9fr) 44px 34px!important;gap:3px!important}.set-check{width:34px!important}.live-exercise-card{padding:10px!important}.rpe-trigger{font-size:11px!important}.muscle-figure svg{height:215px}}
  </style>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="topbar-leading">
        <button id="backBtn" class="icon-btn is-hidden" aria-label="Voltar"></button>
        <div class="topbar-title">
          <small id="topEyebrow">TREINO</small>
          <strong id="topTitle">Início</strong>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="themeToggle" class="icon-btn theme-toggle is-hidden" type="button" aria-label="Ativar modo claro"></button>
        <button id="topActionBtn" class="icon-btn" type="button" aria-label="Mais opções"></button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <button id="activeWorkoutPill" class="active-workout-pill is-hidden" type="button" aria-label="Voltar ao treino em andamento">
      <span class="pulse-dot"></span>
      <span class="active-workout-copy"><small>Treino em andamento</small><strong id="activeWorkoutLabel">Abrir treino</strong></span>
      <span id="activeWorkoutClock" class="active-workout-clock">00:00</span>
    </button>

    <nav id="bottomNav" class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item is-active" data-route="home" type="button"><span data-icon="home"></span><small>Início</small></button>
      <button class="nav-item" data-route="students" type="button"><span data-icon="users"></span><small>Alunos</small></button>
      <button class="nav-item" data-route="exercises" type="button"><span data-icon="dumbbell"></span><small>Exercícios</small></button>
      <button class="nav-item" data-route="evolution" type="button"><span data-icon="chart"></span><small>Evolução</small></button>
    </nav>
  </div>

  <div id="modalLayer" class="modal-layer is-hidden" aria-hidden="true">
    <div id="modalBackdrop" class="modal-backdrop"></div>
    <section id="modal" class="modal" role="dialog" aria-modal="true"></section>
  </div>

  <div id="toastHost" class="toast-host" aria-live="polite"></div>

  <div id="restTimer" class="rest-timer is-hidden">
    <div class="rest-timer-main">
      <small>DESCANSO</small>
      <strong id="restTimerValue">00:00</strong>
    </div>
    <div class="rest-timer-actions">
      <button id="restMinus" type="button">−15s</button>
      <button id="restPlus" type="button">+15s</button>
      <button id="restSkip" class="rest-skip" type="button">Pular</button>
    </div>
  </div>

  <div id="printArea" class="print-area" aria-hidden="true"></div>
  <input id="backupImportInput" class="is-hidden" type="file" accept="application/json,.json">

  <!-- Carregado de forma síncrona no fim do body para permitir as sobrescritas abaixo. -->
  <script src="./app.js"></script>
  <script>
  'use strict';

  /* ============================================================
     INDEX-ONLY PATCH — UI/UX da sessão, RPE, resumo e mapa muscular
     ============================================================ */

  function sevenDaySessions(){
    const cutoff=Date.now()-7*86400000;
    return db.sessions.filter(s=>sessionTimestamp(s)>=cutoff).sort((a,b)=>sessionTimestamp(b)-sessionTimestamp(a));
  }

  function openDashboardMetric(kind){
    if(kind==='students') return navigate('students');
    const sessions=sevenDaySessions();
    if(kind==='top'){
      const top=findTopImprovementAcrossStudents('90d');
      if(!top) return navigate('evolution');
      navigate('evolution-detail',{evolutionStudentId:top.student.id});
      setTimeout(()=>{if(typeof openExerciseHistory==='function'&&top.exerciseId)openExerciseHistory(top.student.id,top.exerciseId);},80);
      return;
    }
    const isSets=kind==='sets';
    const totalSets=sessions.reduce((sum,s)=>sum+sessionSetCount(s),0);

  function muscleMapHtml(participant){const stats=liveMuscleStats(participant);if(!stats.length)return '';const chips=stats.slice(0,8).map(row=>`<span class="muscle-chip"><i></i><span>${esc(row.group)}</span><b>${round(row.sets)}s${row.volume>0?` · ${kgText(row.volume)}`:''}</b></span>`).join('');return `<div class="muscle-map-card"><div class="muscle-map-head"><div><strong>Mapa muscular</strong><small>Os grupos realmente trabalhados nesta sessão.</small></div><span>${stats.length} grupo${stats.length===1?'':'s'}</span></div><div class="muscle-bodies"><div class="muscle-figure"><small>FRENTE</small>${frontBodySvg(stats)}</div><div class="muscle-figure"><small>COSTAS</small>${backBodySvg(stats)}</div></div><div class="muscle-labels">${chips}</div></div>`;}

  function xmlEsc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));}
  function shareMuscleFill(stats,name){const h=muscleHeat(stats,name);if(!h)return '#D7E0E7';const a=.34+.66*h;const base=[10,66,126],idle=[215,224,231];const mix=(x,y)=>Math.round(y+(x-y)*a);return `rgb(${mix(base[0],idle[0])},${mix(base[1],idle[1])},${mix(base[2],idle[2])})`;}
  function shareFrontBody(stats){const f=n=>shareMuscleFill(stats,n);return `<g transform="translate(120 540) scale(1.45)"><g fill="#E8EDF1" stroke="#B9C6D0" stroke-width="1"><ellipse cx="110" cy="31" rx="24" ry="28"/><path d="M101 57 L99 70 Q80 74 66 88 Q58 98 57 115 L62 176 Q69 197 77 213 L72 252 Q68 287 72 325 L76 389 L92 389 L102 274 L108 274 L118 389 L134 389 L138 325 Q142 287 138 252 L143 213 Q151 197 158 176 L163 115 Q162 98 154 88 Q140 74 121 70 L119 57 Z"/><path d="M62 93 Q48 100 44 120 L28 196 Q27 209 38 211 Q47 209 50 197 L67 136 Z"/><path d="M158 93 Q172 100 176 120 L192 196 Q193 209 182 211 Q173 209 170 197 L153 136 Z"/><path d="M28 196 Q25 215 31 231 Q35 238 40 231 L45 213 Q42 201 38 196 Z"/><path d="M192 196 Q195 215 189 231 Q185 238 180 231 L175 213 Q178 201 182 196 Z"/><path d="M74 385 Q67 397 69 405 L98 405 Q100 399 92 389 Z"/><path d="M146 385 Q153 397 151 405 L122 405 Q120 399 128 389 Z"/></g><g stroke="#9FB1BE" stroke-width=".6"><ellipse fill="${f('Ombros')}" cx="69" cy="102" rx="17" ry="15"/><ellipse fill="${f('Ombros')}" cx="151" cy="102" rx="17" ry="15"/><path fill="${f('Peito')}" d="M78 100 Q92 85 108 92 L108 132 Q91 138 76 124 Z"/><path fill="${f('Peito')}" d="M142 100 Q128 85 112 92 L112 132 Q129 138 144 124 Z"/><ellipse fill="${f('Bíceps')}" cx="51" cy="145" rx="11" ry="27" transform="rotate(9 51 145)"/><ellipse fill="${f('Bíceps')}" cx="169" cy="145" rx="11" ry="27" transform="rotate(-9 169 145)"/><path fill="${f('Abdômen')}" d="M94 139 Q110 133 126 139 L126 204 Q110 214 94 204 Z"/><path fill="${f('Adutores')}" d="M91 226 Q103 215 108 230 L103 309 Q94 314 87 300 Z"/><path fill="${f('Adutores')}" d="M129 226 Q117 215 112 230 L117 309 Q126 314 133 300 Z"/><path fill="${f('Quadríceps')}" d="M76 222 Q91 211 102 226 L96 317 Q83 329 72 313 L69 271 Z"/><path fill="${f('Quadríceps')}" d="M144 222 Q129 211 118 226 L124 317 Q137 329 148 313 L151 271 Z"/><path fill="${f('Panturrilhas')}" d="M75 323 Q87 314 95 327 L90 376 Q82 385 76 374 Z"/><path fill="${f('Panturrilhas')}" d="M145 323 Q133 314 125 327 L130 376 Q138 385 144 374 Z"/></g></g>`;}
  function shareBackBody(stats){const f=n=>shareMuscleFill(stats,n);return `<g transform="translate(620 540) scale(1.45)"><g fill="#E8EDF1" stroke="#B9C6D0" stroke-width="1"><ellipse cx="110" cy="31" rx="24" ry="28"/><path d="M101 57 L99 70 Q80 74 66 88 Q58 98 57 115 L62 176 Q69 197 77 213 L72 252 Q68 287 72 325 L76 389 L92 389 L102 274 L108 274 L118 389 L134 389 L138 325 Q142 287 138 252 L143 213 Q151 197 158 176 L163 115 Q162 98 154 88 Q140 74 121 70 L119 57 Z"/><path d="M62 93 Q48 100 44 120 L28 196 Q27 209 38 211 Q47 209 50 197 L67 136 Z"/><path d="M158 93 Q172 100 176 120 L192 196 Q193 209 182 211 Q173 209 170 197 L153 136 Z"/><path d="M28 196 Q25 215 31 231 Q35 238 40 231 L45 213 Q42 201 38 196 Z"/><path d="M192 196 Q195 215 189 231 Q185 238 180 231 L175 213 Q178 201 182 196 Z"/><path d="M74 385 Q67 397 69 405 L98 405 Q100 399 92 389 Z"/><path d="M146 385 Q153 397 151 405 L122 405 Q120 399 128 389 Z"/></g><g stroke="#9FB1BE" stroke-width=".6"><ellipse fill="${f('Ombros')}" cx="69" cy="102" rx="17" ry="15"/><ellipse fill="${f('Ombros')}" cx="151" cy="102" rx="17" ry="15"/><path fill="${f('Costas')}" d="M95 83 Q110 73 125 83 L130 112 Q123 123 110 127 Q97 123 90 112 Z"/><path fill="${f('Costas')}" d="M78 112 Q91 98 108 111 L105 183 Q91 198 76 181 L69 139 Z"/><path fill="${f('Costas')}" d="M142 112 Q129 98 112 111 L115 183 Q129 198 144 181 L151 139 Z"/><ellipse fill="${f('Tríceps')}" cx="51" cy="145" rx="11" ry="28" transform="rotate(9 51 145)"/><ellipse fill="${f('Tríceps')}" cx="169" cy="145" rx="11" ry="28" transform="rotate(-9 169 145)"/><path fill="${f('Glúteos')}" d="M78 205 Q94 195 108 209 L106 245 Q91 258 75 244 L72 221 Z"/><path fill="${f('Glúteos')}" d="M142 205 Q126 195 112 209 L114 245 Q129 258 145 244 L148 221 Z"/><path fill="${f('Posteriores')}" d="M75 250 Q89 239 102 252 L97 319 Q85 328 74 316 L69 277 Z"/><path fill="${f('Posteriores')}" d="M145 250 Q131 239 118 252 L123 319 Q135 328 146 316 L151 277 Z"/><path fill="${f('Panturrilhas')}" d="M75 323 Q88 312 96 327 L91 377 Q82 387 76 374 Z"/><path fill="${f('Panturrilhas')}" d="M145 323 Q132 312 124 327 L129 377 Q138 387 144 374 Z"/></g></g>`;}
  function summaryShareSvg(participant){const st=studentById(participant.studentId),stats=liveMuscleStats(participant),sets=participant.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0),vol=participant.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((x,s)=>x+setVolume(s),0),0),rpes=participant.exercises.flatMap(e=>e.sets.filter(s=>s.done&&s.rpe).map(s=>Number(s.rpe))).filter(Boolean),avg=rpes.length?(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1).replace('.',','):'—',duration=fmtClock((Date.now()-live.startedAt)/1000),chips=stats.slice(0,5);return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#EDF2F5"/><rect x="42" y="42" width="996" height="1266" rx="58" fill="#FFFFFF"/><text x="92" y="128" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#3194B9">TREINO CONCLUÍDO</text><text x="92" y="195" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="52" font-weight="800" fill="#102A3D">${xmlEsc(st?.name||'Aluno')}</text><text x="92" y="235" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#71818E">${xmlEsc(participant.programName||'Treino')} · ${xmlEsc(fmtDate(Date.now()))}</text><g transform="translate(92 278)">${[['SÉRIES',sets],['VOLUME',kgText(vol)],['RPE MÉDIO',avg],['DURAÇÃO',duration]].map((item,i)=>`<g transform="translate(${i*226} 0)"><rect width="208" height="110" rx="24" fill="#F1F5F7"/><text x="18" y="35" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800" letter-spacing="1" fill="#7C8B96">${item[0]}</text><text x="18" y="78" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="800" fill="#102A3D">${xmlEsc(item[1])}</text></g>`).join('')}</g><text x="92" y="465" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#102A3D">Mapa muscular</text><text x="92" y="497" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="500" fill="#71818E">Grupamentos trabalhados na sessão</text><text x="280" y="545" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#83919C">FRENTE</text><text x="780" y="545" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#83919C">COSTAS</text>${shareFrontBody(stats)}${shareBackBody(stats)}<g transform="translate(92 1172)">${chips.map((r,i)=>`<g transform="translate(${(i%3)*300} ${Math.floor(i/3)*58})"><circle cx="9" cy="9" r="9" fill="${shareMuscleFill(stats,r.group)}"/><text x="28" y="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="650" fill="#415968">${xmlEsc(r.group)}</text></g>`).join('')}</g><text x="988" y="1266" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0A427E">TREINO</text></svg>`;}
  async function saveWorkoutSummaryImage(index){const participant=live?.participants?.[index];if(!participant)return;try{const svg=summaryShareSvg(participant),blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,1080,1350);URL.revokeObjectURL(url);const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png',.96));if(!png)throw new Error('PNG');const st=studentById(participant.studentId),file=new File([png],`treino-${String(st?.name||'aluno').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}-${localDateISO()}.png`,{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:`Resumo do treino — ${st?.name||'Aluno'}`});}else{const out=URL.createObjectURL(png),a=document.createElement('a');a.href=out;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(out),1200);toast('Imagem salva.');}}catch(err){console.warn(err);toast('Não foi possível gerar a imagem neste navegador.');}}

  openFinishWorkout=function(){
    if(!live)return;const completed=live.participants.reduce((a,p)=>a+p.exercises.reduce((x,e)=>x+e.sets.filter(s=>s.done).length,0),0);if(!completed)return toast('Marque pelo menos uma série como concluída.');
    openModal(`<div class="finish-celebration"><div class="finish-check">${icons.check}</div><small>TREINO CONCLUÍDO</small><h2>Parabéns!</h2><p>Resumo da sessão e músculos trabalhados.</p></div>${live.participants.map((p,i)=>{const st=studentById(p.studentId),vol=p.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((x,s)=>x+setVolume(s),0),0),sets=p.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0),rpes=p.exercises.flatMap(e=>e.sets.filter(s=>s.done&&s.rpe).map(s=>Number(s.rpe))).filter(Boolean),avgRpe=rpes.length?(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1).replace('.',','):'—';return `<div class="finish-card"><div class="finish-card-head"><div><strong>${esc(st?.name||'Aluno')}</strong><small>${esc(p.programName||'Treino')}</small></div><span>${fmtClock((Date.now()-live.startedAt)/1000)}</span></div><div class="finish-stats"><div><small>SÉRIES</small><strong>${sets}</strong></div><div><small>VOLUME</small><strong>${kgText(vol)}</strong></div><div><small>RPE MÉDIO</small><strong>${avgRpe}</strong></div></div>${muscleMapHtml(p)}<button class="btn btn-secondary finish-share-btn" type="button" data-save-summary="${i}">Salvar imagem</button></div>`;}).join('')}<div class="modal-actions"><button class="btn btn-secondary" id="finishCancel">Voltar</button><button class="btn btn-primary" id="finishSave">Salvar treino</button></div>`,{fullscreen:true});
    $('#finishCancel').onclick=closeModal;$('#finishSave').onclick=saveFinishedWorkout;$$('[data-save-summary]',$('#modal')).forEach(btn=>btn.onclick=()=>saveWorkoutSummaryImage(+btn.dataset.saveSummary));
  };

  const originalApplyTheme=applyTheme;
  applyTheme=function(theme,persistChoice=true){originalApplyTheme(theme,persistChoice);const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',theme==='light'?'#F4F5F8':'#0A427E');};
